<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实用工具 - BirdCloud</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 覆盖 style.css 的 .container 网格布局，改为整行流式布局 */
        main.container {
            width: 92%;
            max-width: 1100px;
            display: block;
            margin-bottom: 60px;
        }

        .page-title {
            color: #4682b4;
            font-size: 26px;
            margin: 24px 0 6px;
        }

        .page-sub {
            color: #777;
            margin-bottom: 20px;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
        }

        .tool-card {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 12px rgba(173, 216, 230, 0.25);
        }

        .tool-card h2 {
            color: #4682b4;
            margin-bottom: 6px;
            font-size: 20px;
        }

        .tool-card .tool-desc {
            color: #888;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .tool-card input[type="text"],
        .tool-card input[type="date"] {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border: 1px solid #cfe3ee;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 12px;
            outline: none;
        }

        .tool-card input:focus {
            border-color: #4682b4;
        }

        /* ---- 鸟类图鉴 ---- */
        .bird-list {
            max-height: 480px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 12px;
        }

        .bird-item {
            background: #f4fafd;
            border: 1px solid #dceef6;
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: box-shadow .15s;
        }

        .bird-item:hover {
            box-shadow: 0 2px 8px rgba(70, 130, 180, .25);
        }

        .bird-item .bird-photo {
            width: 100%;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 10px;
            background: #eaf3f8;
            display: block;
        }

        .bird-item h3 {
            margin: 0 0 2px;
            font-size: 16px;
            color: #2c5f8a;
        }

        .bird-item .sci {
            font-style: italic;
            color: #999;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .bird-item .feat {
            font-size: 13px;
            color: #555;
            line-height: 1.5;
        }

        .bird-item .extra {
            display: none;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #cfe3ee;
            font-size: 13px;
            color: #555;
            line-height: 1.6;
        }

        .bird-item.open .extra {
            display: block;
        }

        .empty-hint {
            color: #999;
            font-size: 14px;
            padding: 20px 0;
            text-align: center;
        }

        /* ---- 今日推荐 ---- */
        .pick-result {
            margin-top: 12px;
            background: #f4fafd;
            border: 1px solid #dceef6;
            border-radius: 10px;
            padding: 16px;
            display: none;
        }

        .pick-result.show {
            display: block;
        }

        .pick-result .pick-photo {
            width: 100%;
            height: auto;
            max-height: 360px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 12px;
            background: #eaf3f8;
        }

        .pick-result h3 {
            margin: 0 0 2px;
            font-size: 18px;
            color: #2c5f8a;
        }

        .pick-result .sci {
            font-style: italic;
            color: #999;
            font-size: 13px;
        }

        .pick-result p {
            margin: 8px 0 0;
            font-size: 14px;
            color: #555;
            line-height: 1.7;
        }

        /* ---- 观鸟清单 ---- */
        .check-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .check-prog {
            font-size: 13px;
            color: #555;
        }

        .check-reset {
            background: none;
            border: none;
            color: #d1493f;
            font-size: 12px;
            cursor: pointer;
            padding: 0;
            text-decoration: underline;
        }

        .prog-wrap {
            height: 10px;
            background: #eaf0f5;
            border-radius: 6px;
            overflow: hidden;
            margin: 8px 0 14px;
        }

        .prog-bar {
            height: 100%;
            background: #2c9e6b;
            width: 0%;
            border-radius: 6px;
            transition: width 0.3s;
        }

        .check-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 8px;
        }

        .check-item {
            background: #f7fbfd;
            border: 1px solid #dceef6;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 13px;
            color: #444;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .check-item:hover {
            background: #eef7fb;
        }

        .check-item .ck {
            color: #bbb;
        }

        .check-item.done {
            background: #e9f7f0;
            border-color: #bfe6d0;
            color: #1e6b4a;
        }

        .check-item.done .ck {
            color: #2c9e6b;
        }

        /* ---- 看图猜鸟 ---- */
        .quiz-img {
            width: 100%;
            height: auto;
            max-height: 260px;
            object-fit: contain;
            border-radius: 8px;
            background: #eaf3f8;
            margin-bottom: 12px;
        }

        .quiz-score {
            margin-bottom: 10px;
            font-size: 13px;
            color: #555;
        }

        .quiz-options {
            display: grid;
            gap: 8px;
        }

        .quiz-opt {
            text-align: left;
            padding: 10px 12px;
            border: 1px solid #dceef6;
            background: #f7fbfd;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #2c5f8a;
        }

        .quiz-opt:hover {
            background: #eef7fb;
        }

        .quiz-opt.correct {
            background: #e9f7f0;
            border-color: #bfe6d0;
            color: #1e6b4a;
        }

        .quiz-opt.wrong {
            background: #fdecea;
            border-color: #f3b7af;
            color: #a33;
        }

        .quiz-opt:disabled {
            cursor: default;
            opacity: 0.9;
        }

        .quiz-status {
            margin-top: 10px;
            font-size: 14px;
            min-height: 20px;
        }

        .quiz-actions {
            margin-top: 10px;
        }

        /* ---- 冷知识 ---- */
        .tip-box {
            background: #fff8e6;
            border: 1px solid #f0dfa8;
            border-radius: 10px;
            padding: 14px 16px;
            font-size: 14px;
            line-height: 1.8;
            color: #6b5716;
            min-height: 70px;
        }

        .btn {
            cursor: pointer;
            border: none;
        }
    </style>
</head>

        <nav>

    <main class="container">
        <h1 class="page-title">🛠️ 观鸟实用工具</h1>
        <p class="page-sub">图鉴查询、每日推荐、清单打卡、猜鸟游戏，一页玩转</p>

        <div class="tools-grid">
            <!-- 工具一：鸟类图鉴 -->
            <section class="tool-card">
                <h2>🔍 鸟类图鉴查询</h2>
                <p class="tool-desc">输入名称快速检索常见鸟类，点击卡片查看习性详情</p>
                <input type="text" id="birdSearch" placeholder="输入鸟名，如：麻雀 / 翠鸟 / 白鹭……">
                <div class="bird-list" id="birdList"></div>
            </section>

            <!-- 工具二：今日观鸟推荐 -->
            <section class="tool-card">
                <h2>🎲 今日观鸟推荐</h2>
                <p class="tool-desc">不知道看什么？随机推荐一种鸟，带上它的识别要点</p>
                <button class="btn" id="pickBtn">给我推荐一只鸟</button>
                <div class="pick-result" id="pickResult"></div>
            </section>

            <!-- 工具三：我的观鸟清单 -->
            <section class="tool-card">
                <h2>✅ 我的观鸟清单</h2>
                <p class="tool-desc">把看过的鸟种点亮，追踪你的观鸟进度</p>
                <div class="check-head">
                    <span class="check-prog" id="checkProg">已记录 0 / 0 种（0%）</span>
                    <button class="check-reset" id="checkReset">清空清单</button>
                </div>
                <div class="prog-wrap"><div class="prog-bar" id="progBar"></div></div>
                <div class="check-grid" id="checkGrid"></div>
            </section>

            <!-- 工具四：看图猜鸟 -->
            <section class="tool-card">
                <h2>🎯 看图猜鸟</h2>
                <p class="tool-desc">看照片猜鸟名，测测你的识鸟功力</p>
                <div class="quiz-score" id="quizScore">得分 0 · 已答 0</div>
                <img class="quiz-img" id="quizImg" alt="猜猜这是哪种鸟">
                <div class="quiz-options" id="quizOpts"></div>
                <div class="quiz-status" id="quizStatus"></div>
                <div class="quiz-actions">
                    <button class="btn" id="quizNext">下一题</button>
                </div>
            </section>

            <!-- 工具五：观鸟冷知识 -->
            <section class="tool-card">
                <h2>💡 观鸟冷知识</h2>
                <p class="tool-desc">一分钟了解一个鸟类小秘密</p>
                <div class="tip-box" id="tipBox"></div>
                <button class="btn" id="tipBtn" style="margin-top:10px;">换一条</button>
            </section>
        </div>
    </main>

    <footer>
        <p>BirdCloud 观鸟笔记 © 2026</p>
    </footer>

            { name: "山斑鸠", sci: "Streptopelia orientalis", feat: "灰粉褐羽，颈侧黑白条纹斑，无珠点", habitat: "林缘、农田、公园", food: "谷物、种子、浆果", tip: "与珠颈斑鸠相似，颈斑呈条纹状" },
            { name: "小鸊鷉", sci: "Tachybaptus ruficollis", feat: "小水鸟，颈侧红棕、嘴基黄斑，善潜泳", habitat: "公园湖泊、水塘、湿地", food: "小鱼、虾、水生昆虫", tip: "遇险先潜水，只露脑袋观察" },
            { name: "棕头鸦雀", sci: "Sinosuthora webbiana", feat: "棕褐色小圆球，尾长，喙短厚似鹦鹉嘴", habitat: "芦苇丛、灌丛、竹丛", food: "昆虫、草籽", tip: "常成群在草丛里“啾啾”窜动" }
        ];

        // ============ 工具一：图鉴查询 ============
        var searchInput = document.getElementById("birdSearch");
        var birdList = document.getElementById("birdList");

        // 每只鸟对应的图片（顺序与 BIRDS 数组一致）
        var BIRD_IMGS = [
            "images/birds/01-treesparrow.png",
            "images/birds/02-magpie.png",
            "images/birds/03-barnswallow.png",
            "images/birds/04-bulbul.png",
            "images/birds/05-blackbird.png",
            "images/birds/06-spotteddove.png",
            "images/birds/07-littleegret.png",
            "images/birds/08-greyheron.png",
            "images/birds/09-kingfisher.png",
            "images/birds/10-woodpecker.png",
            "images/birds/11-redbilledbluemagpie.png",
            "images/birds/12-hoopoe.png",
            "images/birds/13-crestedmyna.png",
            "images/birds/14-whitewagtail.png",
            "images/birds/15-scopsowl.png",
            "images/birds/16-nightheron.png",
            "images/birds/17-hwamei.png",
            "images/birds/18-oriole.png",
            "images/birds/19-longtailshrike.png",
            "images/birds/20-cormorant.png",
            "images/birds/21-coot.png",
            "images/birds/22-azurewingedmagpie.png",
            "images/birds/23-redstart.png",
            "images/birds/24-spotbilledduck.png",
            "images/birds/25-redwhiskeredbulbul.png",
            "images/birds/26-greattit.png",
            "images/birds/27-japwhiteeye.png",
            "images/birds/28-magpierobin.png",
            "images/birds/29-whitecheekedstarling.png",
            "images/birds/30-orientalturtledove.png",
            "images/birds/31-littlegrebe.png",
            "images/birds/32-parrotbill.png"
        ];

        function esc(s) {
            return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        function renderBirds(keyword) {
            var kw = (keyword || "").trim().toLowerCase();

            // 保留每只鸟在 BIRDS 中的全局索引，用于取对应图片
            var list = [];
            for (var gi = 0; gi < BIRDS.length; gi++) {
                var b = BIRDS[gi];
                if (!kw ||
                    b.name.indexOf(kw) > -1 ||
                    b.sci.toLowerCase().indexOf(kw) > -1 ||
                    b.habitat.indexOf(kw) > -1 ||
                    b.food.indexOf(kw) > -1) {
                    list.push({ bird: b, idx: gi });
                }
            }

            if (list.length === 0) {
                birdList.innerHTML = '<div class="empty-hint">没有找到相关鸟类，换个关键词试试</div>';
                return;
            }

            var html = "";
            for (var i = 0; i < list.length; i++) {
                var b = list[i].bird;
                var img = BIRD_IMGS[list[i].idx] || "";
                html += '<div class="bird-item" data-i="' + list[i].idx + '">' +
                    '<h3>' + esc(b.name) + '</h3>' +
                    '<div class="sci">' + esc(b.sci) + '</div>' +
                    '<div class="feat">' + esc(b.feat) + '</div>' +
                    '<div class="extra">' +
                    '<img class="bird-photo" src="' + esc(img) + '" alt="' + esc(b.name) + '" decoding="async">' +
                    '🏠 栖息：' + esc(b.habitat) + '<br>' +
                    '🍽 食性：' + esc(b.food) + '<br>' +
                    '💡 ' + esc(b.tip) + '</div>' +
                    '</div>';
            }
            birdList.innerHTML = html;
        }

        searchInput.addEventListener("input", function () {
            renderBirds(searchInput.value);
        });

        birdList.addEventListener("click", function (e) {
            var item = e.target.closest ? e.target.closest(".bird-item") : null;
            if (!item) return;
            var wasOpen = item.classList.contains("open");
            var openItems = birdList.querySelectorAll(".bird-item.open");
            for (var i = 0; i < openItems.length; i++) openItems[i].classList.remove("open");
            if (!wasOpen) item.classList.add("open");
        });

        renderBirds("");

        // ============ 工具二：今日观鸟推荐 ============
        var pickBtn = document.getElementById("pickBtn");
        var pickResult = document.getElementById("pickResult");

        pickBtn.addEventListener("click", function () {
            var bi = Math.floor(Math.random() * BIRDS.length);
            var b = BIRDS[bi];
            pickResult.innerHTML =
                '<img class="pick-photo" src="' + esc(BIRD_IMGS[bi]) + '" alt="' + esc(b.name) + '">' +
                '<h3>🐦 ' + esc(b.name) + '</h3>' +
                '<div class="sci">' + esc(b.sci) + '</div>' +
                '<p>🔍 ' + esc(b.feat) + '<br>' +
                '🏠 ' + esc(b.habitat) + '<br>' +
                '🍽 ' + esc(b.food) + '<br>' +
                '💡 ' + esc(b.tip) + '</p>';
            pickResult.classList.add("show");
        });

        // ============ 工具三：我的观鸟清单 ============
        var CHECK_KEY = "birdcloud-checklist";
        var checkGrid = document.getElementById("checkGrid");
        var checkProg = document.getElementById("checkProg");
        var progBar = document.getElementById("progBar");
        var checkReset = document.getElementById("checkReset");

        function getChecklist() {
            try {
                var raw = localStorage.getItem(CHECK_KEY);
                var obj = raw ? JSON.parse(raw) : {};
                return obj && typeof obj === "object" ? obj : {};
            } catch (e) { return {}; }
        }

        function saveChecklist(obj) {
            try { localStorage.setItem(CHECK_KEY, JSON.stringify(obj)); } catch (e) { }
        }

        function renderChecklist() {
            var obj = getChecklist();
            var done = 0;
            var html = "";
            for (var i = 0; i < BIRDS.length; i++) {
                var name = BIRDS[i].name;
                var has = !!obj[name];
                if (has) done++;
                html += '<div class="check-item' + (has ? " done" : "") + '" data-name="' + esc(name) + '">' +
                    '<span class="ck">' + (has ? "✅" : "⚪") + '</span>' +
                    '<span>' + esc(name) + '</span></div>';
            }
            checkGrid.innerHTML = html;
            var pct = BIRDS.length ? Math.round(done * 100 / BIRDS.length) : 0;
            checkProg.textContent = "已记录 " + done + " / " + BIRDS.length + " 种（" + pct + "%）";
            progBar.style.width = pct + "%";
        }

        checkGrid.addEventListener("click", function (e) {
            var item = e.target.closest ? e.target.closest(".check-item") : null;
            if (!item) return;
            var obj = getChecklist();
            var name = item.getAttribute("data-name");
            if (obj[name]) {
                delete obj[name];
            } else {
                obj[name] = true;
            }
            saveChecklist(obj);
            renderChecklist();
        });

        checkReset.addEventListener("click", function () {
            if (confirm("确定清空观鸟清单吗？")) {
                saveChecklist({});
                renderChecklist();
            }
        });

        renderChecklist();

        // ============ 工具四：看图猜鸟 ============
        var quizImg = document.getElementById("quizImg");
        var quizOpts = document.getElementById("quizOpts");
        var quizStatus = document.getElementById("quizStatus");
        var quizScore = document.getElementById("quizScore");
        var quizNext = document.getElementById("quizNext");
        var quizData = { score: 0, answered: 0, answerIdx: -1, locked: false };

        function shuffleArr(a) {
            for (var i = a.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var t = a[i]; a[i] = a[j]; a[j] = t;
            }
            return a;
        }

        function newQuiz() {
            quizData.locked = false;
            var answer = Math.floor(Math.random() * BIRDS.length);
            var distractors = [];
            var guard = 0;
            while (distractors.length < 3 && guard < 200) {
                guard++;
                var r = Math.floor(Math.random() * BIRDS.length);
                if (r !== answer && distractors.indexOf(r) === -1) distractors.push(r);
            }
            var opts = shuffleArr(distractors.concat([answer]));
            quizData.opts = opts;
            quizData.answerIdx = opts.indexOf(answer);
            quizImg.src = BIRD_IMGS[answer];
            quizImg.alt = "猜猜这是哪种鸟";
            var html = "";
            for (var i = 0; i < opts.length; i++) {
                html += '<button class="quiz-opt" data-i="' + i + '">' + esc(BIRDS[opts[i]].name) + '</button>';
            }
            quizOpts.innerHTML = html;
            quizStatus.innerHTML = "";
        }

        quizOpts.addEventListener("click", function (e) {
            var btn = e.target.closest ? e.target.closest(".quiz-opt") : null;
            if (!btn || quizData.locked) return;
            quizData.locked = true;
            quizData.answered++;
            var picked = parseInt(btn.getAttribute("data-i"), 10);
            var optEls = quizOpts.querySelectorAll(".quiz-opt");
            var correctName = BIRDS[quizData.opts[quizData.answerIdx]].name;
            if (picked === quizData.answerIdx) {
                quizData.score++;
                btn.classList.add("correct");
                quizStatus.innerHTML = '🎉 答对了！是「' + esc(correctName) + '」';
            } else {
                btn.classList.add("wrong");
                optEls[quizData.answerIdx].classList.add("correct");
                quizStatus.innerHTML = '😅 答错啦，正确答案是「' + esc(correctName) + '」';
            }
            quizScore.textContent = "得分 " + quizData.score + " · 已答 " + quizData.answered;
        });

        quizNext.addEventListener("click", newQuiz);

        newQuiz();

        // ============ 工具五：观鸟冷知识 ============
        var TIPS = [
            "蜂鸟每秒能扇动翅膀 50~80 次，是世界上振翅最快的鸟之一。",
            "猫头鹰的脖子可以旋转约 270 度，几乎转一整圈。",
            "啄木鸟啄树时头部承受的冲击力堪比撞墙，但特殊的头骨结构能完美缓冲。",
            "鸵鸟是现存最大的鸟，跑起来时速可达 70 公里。",
            "企鹅是鸟类，虽然不会飞，却是出色的游泳健将。",
            "翠鸟俯冲入水捕鱼时速度极快，几乎不溅起水花。",
            "燕子每年迁徙距离可达上万公里，却能精准回到去年的旧巢。",
            "画眉鸟叫声婉转多变，一只画眉能模仿十几种鸟鸣。",
            "白鹭捕食时会用脚在水中轻搅，惊出小鱼再快速啄取。",
            "鸟类没有牙齿，靠胃里的砂囊磨碎食物。",
            "喜鹊是少数能认出镜子里自己的鸟之一，认知能力很高。",
            "啄木鸟的舌头可以伸出比嘴长 3 倍，用来钩取树干里的虫子。",
            "黄鹂的巢像一个小吊篮，悬挂在高高的树梢上。",
            "斑嘴鸭飞行时脖颈直伸，和家鸭的姿态略有不同。",
            "白腰文鸟睡觉时喜欢挤成一团，几十只抱在一起过夜。"
        ];
        var tipBox = document.getElementById("tipBox");
        var tipBtn = document.getElementById("tipBtn");
        var lastTip = -1;

        function showTip() {
            var i = Math.floor(Math.random() * TIPS.length);
            if (TIPS.length > 1 && i === lastTip) i = (i + 1) % TIPS.length;
            lastTip = i;
            tipBox.innerHTML = '🐦 ' + esc(TIPS[i]);
        }

        tipBtn.addEventListener("click", showTip);

        showTip();

    })();
    </script>
</body>
</html>
