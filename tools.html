    <style>
        /* 覆盖 style.css 的 .container 网格布局，改为整行流式布局 */
        main.container {
            width: 92%;
            max-width: 1100px;
            display: block;
            margin-bottom: 60px;
        }

        .page-title {
            color: #4682b4;
            font-size: 26px;
            margin: 24px 0 6px;
        }

        .page-sub {
            color: #777;
            margin-bottom: 20px;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
        }

        .tool-card {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 12px rgba(173, 216, 230, 0.25);
        }

        .tool-card h2 {
            color: #4682b4;
            margin-bottom: 6px;
            font-size: 20px;
        }

        .tool-card .tool-desc {
            color: #888;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .tool-card input[type="text"],
        .tool-card input[type="date"] {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border: 1px solid #cfe3ee;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 12px;
            outline: none;
        }

        .tool-card input:focus {
            border-color: #4682b4;
        }

        /* ---- 鸟类图鉴 ---- */
        .bird-list {
            max-height: 480px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 12px;
        }

        .bird-item {
            background: #f4fafd;
            border: 1px solid #dceef6;
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: box-shadow .15s;
        }

        .bird-item:hover {
            box-shadow: 0 2px 8px rgba(70, 130, 180, .25);
        }

        .bird-item .bird-photo {
            width: 100%;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 10px;
            background: #eaf3f8;
            display: block;
        }

        .bird-item h3 {
            margin: 0 0 2px;
            font-size: 16px;
            color: #2c5f8a;
        }

        .bird-item .sci {
            font-style: italic;
            color: #999;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .bird-item .feat {
            font-size: 13px;
            color: #555;
            line-height: 1.5;
        }

        .bird-item .extra {
            display: none;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #cfe3ee;
            font-size: 13px;
            color: #555;
            line-height: 1.6;
        }

        .bird-item.open .extra {
            display: block;
        }

        .empty-hint {
            color: #999;
            font-size: 14px;
            padding: 20px 0;
            text-align: center;
        }

        /* ---- 今日推荐 ---- */
        .pick-result {
            margin-top: 12px;
            background: #f4fafd;
            border: 1px solid #dceef6;
            border-radius: 10px;
            padding: 16px;
            display: none;
        }

        .pick-result.show {
            display: block;
        }

        .pick-result .pick-photo {
            width: 100%;
            height: auto;
            max-height: 360px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 12px;
            background: #eaf3f8;
        }

        .pick-result h3 {
            margin: 0 0 2px;
            font-size: 18px;
            color: #2c5f8a;
        }

        .pick-result .sci {
            font-style: italic;
            color: #999;
            font-size: 13px;
        }

        .pick-result p {
            margin: 8px 0 0;
            font-size: 14px;
            color: #555;
            line-height: 1.7;
        }

        /* ---- 观鸟记录本 ---- */
        .record-form {
            display: grid;
            gap: 10px;
        }

        .record-list {
            margin-top: 16px;
            display: grid;
            gap: 10px;
        }

        .record-item {
            background: #f4fafd;
            border: 1px solid #dceef6;
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .record-item .r-info {
            flex: 1;
            min-width: 0;
        }

        .record-item .r-name {
            font-weight: bold;
            color: #2c5f8a;
        }

        .record-item .r-meta {
            font-size: 12px;
            color: #888;
            margin-top: 2px;
        }

        .record-item .r-note {
            font-size: 13px;
            color: #555;
            margin-top: 2px;
        }

        .record-del {
            background: none;
            border: none;
            color: #d1493f;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .record-del:hover {
            background: #fdecea;
        }

        .btn {
            cursor: pointer;
            border: none;
        }

        function esc(s) {
            return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        function renderBirds(keyword) {
            var kw = (keyword || "").trim().toLowerCase();

            // 保留每只鸟在 BIRDS 中的全局索引，用于取对应图片
            var list = [];
            for (var gi = 0; gi < BIRDS.length; gi++) {
                var b = BIRDS[gi];
                if (!kw ||
                    b.name.indexOf(kw) > -1 ||
                    b.sci.toLowerCase().indexOf(kw) > -1 ||
                    b.habitat.indexOf(kw) > -1 ||
                    b.food.indexOf(kw) > -1) {
                    list.push({ bird: b, idx: gi });
                }
            }

            if (list.length === 0) {
                birdList.innerHTML = '<div class="empty-hint">没有找到相关鸟类，换个关键词试试</div>';
                return;
            }

            var html = "";
            for (var i = 0; i < list.length; i++) {
                var b = list[i].bird;
                var img = BIRD_IMGS[list[i].idx] || "";
                html += '<div class="bird-item" data-i="' + list[i].idx + '">' +
                    '<h3>' + esc(b.name) + '</h3>' +
                    '<div class="sci">' + esc(b.sci) + '</div>' +
                    '<div class="feat">' + esc(b.feat) + '</div>' +
                    '<div class="extra">' +
                    '<img class="bird-photo" src="' + esc(img) + '" alt="' + esc(b.name) + '" decoding="async">' +
                    '🏠 栖息：' + esc(b.habitat) + '<br>' +
                    '🍽 食性：' + esc(b.food) + '<br>' +
                    '💡 ' + esc(b.tip) + '</div>' +
                    '</div>';
            }
            birdList.innerHTML = html;
        }

        searchInput.addEventListener("input", function () {
            renderBirds(searchInput.value);
        });

        birdList.addEventListener("click", function (e) {
            var item = e.target.closest ? e.target.closest(".bird-item") : null;
            if (!item) return;
            var wasOpen = item.classList.contains("open");
            var openItems = birdList.querySelectorAll(".bird-item.open");
            for (var i = 0; i < openItems.length; i++) openItems[i].classList.remove("open");
            if (!wasOpen) item.classList.add("open");
        });

        renderBirds("");

        // ============ 工具二：今日观鸟推荐 ============
        var pickBtn = document.getElementById("pickBtn");
        var pickResult = document.getElementById("pickResult");

        pickBtn.addEventListener("click", function () {
            var bi = Math.floor(Math.random() * BIRDS.length);
            var b = BIRDS[bi];
            pickResult.innerHTML =
                '<img class="pick-photo" src="' + esc(BIRD_IMGS[bi]) + '" alt="' + esc(b.name) + '">' +
                '<h3>🐦 ' + esc(b.name) + '</h3>' +
                '<div class="sci">' + esc(b.sci) + '</div>' +
                '<p>🔍 ' + esc(b.feat) + '<br>' +
                '🏠 ' + esc(b.habitat) + '<br>' +
                '🍽 ' + esc(b.food) + '<br>' +
                '💡 ' + esc(b.tip) + '</p>';
            pickResult.classList.add("show");
        });

        // ============ 工具三：观鸟记录本（localStorage） ============
        var STORE_KEY = "birdcloud-records";
        var recName = document.getElementById("recName");
        var recPlace = document.getElementById("recPlace");
        var recDate = document.getElementById("recDate");
        var recNote = document.getElementById("recNote");
        var addRec = document.getElementById("addRec");
        var recordList = document.getElementById("recordList");

        function getRecords() {
            try {
                var raw = localStorage.getItem(STORE_KEY);
                var arr = raw ? JSON.parse(raw) : [];
                return Array.isArray(arr) ? arr : [];
            } catch (e) {
                return [];
            }
        }

        function saveRecords(arr) {
            try {
                localStorage.setItem(STORE_KEY, JSON.stringify(arr));
            } catch (e) { }
        }

        function renderRecords() {
            var arr = getRecords();
            if (arr.length === 0) {
                recordList.innerHTML = '<div class="empty-hint">还没有记录，添加第一条观鸟记录吧</div>';
                return;
            }
            var html = "";
            for (var i = 0; i < arr.length; i++) {
                var r = arr[i];
                html += '<div class="record-item">' +
                    '<div class="r-info">' +
                    '<div class="r-name">🐦 ' + esc(r.name) + '</div>' +
                    '<div class="r-meta">' + esc(r.date) + ' · ' + esc(r.place) + '</div>' +
                    (r.note ? '<div class="r-note">' + esc(r.note) + '</div>' : '') +
                    '</div>' +
                    '<button class="record-del" data-i="' + i + '" title="删除这条记录">✕</button>' +
                    '</div>';
            }
            recordList.innerHTML = html;
        }

        addRec.addEventListener("click", function () {
            var name = recName.value.trim();
            var place = recPlace.value.trim() || "未填写";
            var date = recDate.value || new Date().toISOString().slice(0, 10);
            var note = recNote.value.trim();
            if (!name) {
                alert("请先填写鸟种名称");
                return;
            }
            var arr = getRecords();
            arr.unshift({ name: name, place: place, date: date, note: note });
            saveRecords(arr);
            recName.value = "";
            recPlace.value = "";
            recNote.value = "";
            renderRecords();
        });

        recordList.addEventListener("click", function (e) {
            var btn = e.target.closest ? e.target.closest(".record-del") : null;
            if (!btn) return;
            var arr = getRecords();
            arr.splice(parseInt(btn.getAttribute("data-i"), 10), 1);
            saveRecords(arr);
            renderRecords();
        });

        renderRecords();

        // 日期默认今天
        if (!recDate.value) {
            recDate.value = new Date().toISOString().slice(0, 10);
        }

    })();
    </script>
</body>
</html>
