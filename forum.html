    <style>
        main.container {

            margin-bottom: 18px;
        }

        .spot-toolbar input[type="search"] {
            flex: 1;

            border-radius: 8px;
            font-size: 15px;

        .spot-toolbar select {
            padding: 10px 14px;
            border: 1px solid #d0e4ee;
            border-radius: 8px;
            font-size: 15px;
            background: #fff;
            cursor: pointer;
        }

        .prov-stats {
            font-size: 14px;
            color: #668;
            margin-bottom: 4px;
        }

        .prov-block {
            margin-bottom: 26px;
            border: 1px solid #dceef6;
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
        }

        .prov-title {
            background: linear-gradient(135deg, #2c7a4b, #3fa06a);
            color: #fff;
            padding: 12px 18px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .prov-title small {
            font-weight: normal;
            font-size: 13px;
            opacity: .85;
        }

        .prov-spots {
            padding: 12px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 10px;
        }

        .spot-item {
            border: 1px solid #e3eef5;
            border-radius: 10px;
            padding: 12px 14px;
            background: #fbfdfe;
            cursor: pointer;
            transition: box-shadow .15s;
        }

        .spot-item:hover {
            box-shadow: 0 2px 8px rgba(44, 122, 75, .18);
        }

        .spot-item h4 {
            margin: 0 0 4px;
            font-size: 16px;
            color: #1f5b38;
        }

        .spot-item .city {
            font-size: 13px;
            color: #668;
            margin-bottom: 6px;
        }

        .spot-item .feat {
            font-size: 14px;
            color: #444;
            margin-bottom: 4px;
        }

        .spot-item .detail {
            display: none;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #d8e8f0;
            font-size: 14px;
            color: #333;
        }

        .spot-item.open .detail {
            display: block;
        }

        .spot-item .hint {
            font-size: 12px;
            color: #2c7a4b;
            margin-top: 6px;
        }

        .empty-hint {
            text-align: center;
            color: #668;
            padding: 40px 0;
        }
    </style>

        function esc(s) {
            return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        var provStats = document.getElementById("provStats");
        var searchInput = document.getElementById("spotSearch");

        SPOTS.forEach(function (p) {
            var opt = document.createElement("option");
            opt.value = p.prov;
            opt.textContent = p.prov;
            provFilter.appendChild(opt);
        });

        function render() {
            var kw = searchInput.value.trim().toLowerCase();
            var prov = provFilter.value;
            var total = 0;
            var html = "";

            SPOTS.forEach(function (p) {
                if (prov && p.prov !== prov) return;
                var shown = p.spots.filter(function (s) {
                    if (!kw) return true;
                    return (s.name + s.city + s.feat + s.best + s.tip).toLowerCase().indexOf(kw) > -1;
                });
                if (shown.length === 0) return;
                total += shown.length;
                html += '<div class="prov-block">' +
                    '<div class="prov-title">' + esc(p.prov) + '<small>' + shown.length + ' 个地点</small></div>' +
                    '<div class="prov-spots">';
                shown.forEach(function (s) {
                    html += '<div class="spot-item">' +
                        '<h4>' + esc(s.name) + '</h4>' +
                        '<div class="city">📍 ' + esc(s.city) + '</div>' +
                        '<div class="feat">' + esc(s.feat) + '</div>' +
                        '<div class="detail">' +
                        '🗓 最佳季节：' + esc(s.best) + '<br>' +
                        '💡 ' + esc(s.tip) +
                        '</div>' +
                        '<div class="hint">👆 点击查看最佳季节与提示</div>' +
                        '</div>';
                });
                html += '</div></div>';
            });

            if (total === 0) {
                spotList.innerHTML = '<div class="empty-hint">没有找到匹配的观鸟地点，换个关键词试试</div>';
            } else {
                spotList.innerHTML = html;
            }
            provStats.textContent = "共找到 " + total + " 个观鸟地点 · 点击地点卡片展开详情";
        }

        // 点击地点展开详情
        spotList.addEventListener("click", function (e) {
            var item = e.target.closest ? e.target.closest(".spot-item") : null;
            if (item) item.classList.toggle("open");
        });

        searchInput.addEventListener("input", render);
        provFilter.addEventListener("change", render);

        render();
