<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>登录 | BirdCloud</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: linear-gradient(
        180deg,
        #dff5ff,
        #f8fcff
    );

    padding: 20px;
}

.login-box {
    width: min(100%, 420px);

    padding: 35px 28px;

    background: rgba(255,255,255,0.92);

    border-radius: 24px;

    box-shadow:
        0 15px 45px rgba(0,0,0,0.12);

    text-align: center;
}

.logo {
    font-size: 42px;
    margin-bottom: 10px;
}

h1 {
    margin: 0;
    color: #234;
}

.subtitle {
    color: #789;
    margin-top: 8px;
    margin-bottom: 28px;
}

input {
    width: 100%;

    padding: 14px 16px;

    margin-bottom: 14px;

    border: 1px solid #d7e3ea;

    border-radius: 12px;

    font-size: 16px;

    outline: none;

    background: white;
}

input:focus {
    border-color: #72bcd4;
}

.login-btn {
    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 12px;

    font-size: 16px;

    cursor: pointer;

    background: #72bcd4;

    color: white;

    margin-top: 5px;
}

.login-btn:hover {
    opacity: 0.9;
}

.login-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.register-btn {
    display: block;

    width: 100%;

    padding: 14px;

    margin-top: 10px;

    border-radius: 12px;

    color: #4c9ab5;

    background: transparent;

    text-decoration: none;

    font-size: 16px;
}

.register-btn:hover {
    background: rgba(114,188,212,0.1);
}

#message {
    min-height: 24px;

    margin-top: 18px;

    font-size: 14px;

    color: #4c7080;
}

</style>

</head>


<body>

<div class="login-box">

    <div class="logo">🐦</div>

    <h1>BirdCloud</h1>

    <div class="subtitle">
        登录你的鸟窝
    </div>


    <input
        type="email"
        id="email"
        placeholder="邮箱"
        autocomplete="email"
    >


    <input
        type="password"
        id="password"
        placeholder="密码"
        autocomplete="current-password"
    >


    <button
        type="button"
        class="login-btn"
        id="loginButton"
        onclick="login()"
    >
        登录
    </button>


    <a
        href=" "
        class="register-btn"
    >
        注册账号
    </a >


    <div id="message"></div>

</div>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://ljgnwfswcqrzbetshocz.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_wxkURA_31W9WNHZkj-RJzg_WaVoLszA";


const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   登录
========================= */

async function login() {

    const email =
        document
        .getElementById("email")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;

    const button =
        document.getElementById("loginButton");


    if (!email) {

        showMessage("请输入邮箱");

        return;
    }


    if (!password) {

        showMessage("请输入密码");

        return;
    }


    button.disabled = true;

    button.textContent = "登录中……";

    showMessage("正在登录……");


    try {

        const { data, error } =
            await supabase.auth.signInWithPassword({

                email: email,

                password: password

            });


        if (error) {

            console.error(
                "登录错误：",
                error
            );

            showMessage(
                "登录失败：" +
                error.message
            );

            button.disabled = false;

            button.textContent = "登录";

            return;
        }


        console.log(
            "登录成功：",
            data
        );


        showMessage(
            "登录成功！正在进入个人主页……"
        );


        /*
         * 登录成功后进入 profile.html
         */

        setTimeout(function() {

            window.location.href =
                "profile.html";

        }, 500);


    } catch (error) {

        console.error(
            "连接错误：",
            error
        );

        showMessage(
            "连接 Supabase 失败：" +
            error.message
        );

        button.disabled = false;

        button.textContent = "登录";
    }

}


/* =========================
   提示文字
========================= */

function showMessage(text) {

    document
        .getElementById("message")
        .textContent = text;

}


/* =========================
   回车登录
========================= */

document
    .getElementById("password")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                login();

            }

        }
    );

</script>

</body>

</html>
