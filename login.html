<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - BirdCloud观鸟社区</title>
    <!-- 第一步：先引入Supabase库，必须在最前面 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft Yahei", sans-serif; }
        body { background: #f0f7ff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-box { background: #fff; padding: 40px 35px; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,92,172,.1); width: 100%; max-width: 380px; }
        .login-box h2 { color: #005cac; text-align: center; margin-bottom: 25px; }
        .login-box input { width: 100%; padding: 12px 15px; margin-bottom: 15px; border: 1px solid #cfe2ff; border-radius: 8px; font-size: 14px; outline: none; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-group button { flex: 1; padding: 11px 0; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
        .btn-login { background: #0066cc; color: #fff; }
        .btn-signup { background: #e6f0ff; color: #0066cc; }
        #msg { margin-top: 18px; text-align: center; font-size: 13px; color: #666; }
        .back-home { display: block; text-align: center; margin-top: 20px; font-size: 13px; color: #0066cc; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>BirdCloud 观鸟社区</h2>
        <input type="email" id="email" placeholder="请输入邮箱">
        <input type="password" id="pwd" placeholder="请输入密码（至少6位）">
        <div class="btn-group">
            <button class="btn-login" onclick="signIn()">登录</button>
            <button class="btn-signup" onclick="signUp()">注册</button>
        </div>
        <p id="msg"></p >
        <a href=" " class="back-home">← 返回首页</a >
    </div>

    <script>
        // ========== 只改这里：替换成你自己的两个密钥 ==========
        const SUPABASE_URL = "https://ljgnwfswcqrzbetshocz.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_wxkURA_31W9WNHZkj-RJzg_WaVoLszA";
        // ======================================================

        // 第二步：初始化客户端，必须在函数前面
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 注册函数
        async function signUp(){
            const email = document.getElementById("email").value;
            const pwd = document.getElementById("pwd").value;
            document.getElementById("msg").innerText = "注册中...";
            
            const { error } = await supabase.auth.signUp({ email, password: pwd });
            if(error){
                document.getElementById("msg").innerText = "❌ 注册失败：" + error.message;
            }else{
                document.getElementById("msg").innerText = "✅ 注册成功！请到邮箱点击验证链接";
            }
        }

        // 登录函数，登录成功跳个人主页
        async function signIn(){
            const email = document.getElementById("email").value;
            const pwd = document.getElementById("pwd").value;
            document.getElementById("msg").innerText = "登录中...";
            
            const { error } = await supabase.auth.signInWithPassword({ email, password: pwd });
            if(error){
                document.getElementById("msg").innerText = "❌ 登录失败：" + error.message;
            }else{
                document.getElementById("msg").innerText = "✅ 登录成功，正在跳转...";
                // 👇 这里改个人主页文件名，比如 profile.html
                setTimeout(() => { window.location.href = "./profile.html"; }, 800);
            }
        }
    </script>
</body>
</html>
