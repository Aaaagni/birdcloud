<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>登录 | BirdCloud</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: linear-gradient(
        180deg,
        #dff5ff,
        #f8fcff
    );

    padding: 20px;
}


/* 登录卡片 */

.login-box {
    width: min(100%, 420px);

    padding: 35px 28px;

    background: rgba(255, 255, 255, 0.92);

    border-radius: 24px;

    box-shadow:
        0 15px 45px rgba(0, 0, 0, 0.12);

    text-align: center;
}


/* Logo */

.logo {
    font-size: 42px;
    margin-bottom: 10px;
}


/* 标题 */

h1 {
    margin: 0;

    color: #234;

    font-size: 32px;
}


/* 副标题 */

.subtitle {
    color: #789;

    margin-top: 8px;
    margin-bottom: 28px;

    font-size: 16px;
}


/* 输入框 */

input {
    width: 100%;

    padding: 14px 16px;

    margin-bottom: 14px;

    border: 1px solid #d7e3ea;

    border-radius: 12px;

    font-size: 16px;

    outline: none;

    background: white;
}


input:focus {
    border-color: #72bcd4;

    box-shadow:
        0 0 0 3px rgba(114, 188, 212, 0.15);
}


/* 登录按钮 */

.login-btn {
    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 12px;

    font-size: 16px;

    cursor: pointer;

    background: #72bcd4;

    color: white;

    margin-top: 5px;

    transition: 0.2s;
}


.login-btn:hover {
    opacity: 0.9;
}


.login-btn:disabled {
    opacity: 0.6;

    cursor: not-allowed;
}


/* 注册按钮 */

.register-btn {
    display: block;

    width: 100%;

    padding: 14px;

    margin-top: 10px;

    border-radius: 12px;

    color: #4c9ab5;

    background: transparent;

    text-decoration: none;

    font-size: 16px;

    transition: 0.2s;
}


.register-btn:hover {
    background: rgba(114, 188, 212, 0.1);
}


/* 消息 */

#message {
    min-height: 24px;

    margin-top: 18px;

    font-size: 14px;

    color: #4c7080;
}


/* 手机适配 */

@media (max-width: 480px) {

    body {
        padding: 15px;
    }

    .login-box {
        padding: 30px 22px;

        border-radius: 20px;
    }

    h1 {
        font-size: 28px;
    }

    .logo {
        font-size: 38px;
    }

}

</style>

</head>


<body>


<div class="login-box">

    <!-- Logo -->

    <div class="logo">
        🐦
    </div>


    <!-- 标题 -->

    <h1>
        BirdCloud
    </h1>


    <div class="subtitle">
        登录你的鸟窝
    </div>


    <!-- 邮箱 -->

    <input
        type="email"
        id="email"
        placeholder="邮箱"
        autocomplete="email"
    >


    <!-- 密码 -->

    <input
        type="password"
        id="password"
        placeholder="密码"
        autocomplete="current-password"
    >


    <!-- 登录 -->

    <button
        type="button"
        class="login-btn"
        id="loginButton"
        onclick="login()"
    >
        登录
    </button>


    <!-- 注册 -->

    <a
        href=" "
        class="register-btn"
    >
        注册账号
    </a >


    <!-- 提示 -->

    <div id="message"></div>

</div>



<!-- =========================
     Supabase
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================
   Supabase 配置
========================= */

const SUPABASE_URL =
    "https://ljgnwfswcqrzbetshocz.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_wxkURA_31W9WNHZkj-RJzg_WaVoLszA";


const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =========================
   登录
========================= */

async function login() {

    const email =
        document
        .getElementById("email")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value;


    const loginButton =
        document.getElementById("loginButton");


    /* 检查邮箱 */

    if (!email) {

        showMessage("请输入邮箱");

        return;
    }


    /* 检查密码 */

    if (!password) {

        showMessage("请输入密码");

        return;
    }


    /* 禁用按钮 */

    loginButton.disabled = true;

    loginButton.textContent = "登录中……";


    showMessage("正在登录……");


    try {

        /* Supabase 登录 */

        const { data, error } =
            await supabase.auth.signInWithPassword({

                email: email,

                password: password

            });


        /* 登录失败 */

        if (error) {

            console.error(
                "登录错误：",
                error
            );


            showMessage(
                "登录失败：" +
                error.message
            );


            loginButton.disabled = false;

            loginButton.textContent = "登录";

            return;
        }


        /* 确认登录成功 */

        if (!data || !data.user) {

            showMessage(
                "登录失败：没有获取到用户信息"
            );


            loginButton.disabled = false;

            loginButton.textContent = "登录";

            return;
        }


        /* 登录成功 */

        showMessage(
            "登录成功，正在进入个人主页……"
        );


        /*
         * 进入个人主页
         *
         * login.html 和 profile.html
         * 必须在同一个文件夹
         */

        setTimeout(() => {

            window.location.href =
                "profile.html";

        }, 500);


    } catch (error) {

        console.error(
            "系统错误：",
            error
        );


        showMessage(
            "登录出现错误，请稍后再试"
        );


        loginButton.disabled = false;

        loginButton.textContent = "登录";
    }

}



/* =========================
   显示消息
========================= */

function showMessage(text) {

    document
        .getElementById("message")
        .textContent = text;

}



/* =========================
   按 Enter 登录
========================= */

document
    .getElementById("password")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                login();

            }

        }
    );


</script>


</body>

</html>
