<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>登录 | BirdCloud</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: linear-gradient(
        180deg,
        #dff5ff,
        #f8fcff
    );
}

.login-box {
    width: min(90%, 420px);
    padding: 35px 28px;

    background: rgba(255,255,255,0.9);
    border-radius: 24px;

    box-shadow:
        0 15px 45px rgba(0,0,0,0.12);

    text-align: center;
}

.logo {
    font-size: 42px;
    margin-bottom: 10px;
}

h1 {
    margin: 0;
    color: #234;
}

.subtitle {
    color: #789;
    margin-bottom: 28px;
}

input {
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 14px;

    border: 1px solid #d7e3ea;
    border-radius: 12px;

    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #72bcd4;
}

button {
    width: 100%;
    padding: 14px;

    border: none;
    border-radius: 12px;

    font-size: 16px;
    cursor: pointer;

    background: #72bcd4;
    color: white;

    margin-top: 5px;
}

button:hover {
    opacity: 0.9;
}

.register-btn {
    background: transparent;
    color: #4c9ab5;
}

#message {
    min-height: 24px;
    margin-top: 18px;
    font-size: 14px;
}
</style>

</head>

<body>

<div class="login-box">

    <div class="logo">🐦</div>

    <h1>BirdCloud</h1>

    <div class="subtitle">
        登录你的鸟窝
    </div>

    <input
        type="email"
        id="email"
        placeholder="邮箱"
    >

    <input
        type="password"
        id="password"
        placeholder="密码"
    >

    <button onclick="login()">
        登录
    </button>

    <button
        class="register-btn"
        onclick="register()"
    >
        注册账号
    </button>

    <div id="message"></div>

</div>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://jgnwfswcqrzbetshocz.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_wxkURA_31W9WNHZkj-RJzg_WaVoLszA";

const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// 登录
async function login() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    if (!email || !password) {
        showMessage("请输入邮箱和密码");
        return;
    }

    showMessage("正在登录……");

    const { data, error } =
        await supabase.auth.signInWithPassword({
            email,
            password
        });

    if (error) {
        showMessage("登录失败：" + error.message);
        return;
    }

    showMessage("登录成功！");

    setTimeout(() => {
        window.location.href = "index.html";
    }, 800);
}


// 注册
async function register() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    if (!email || !password) {
        showMessage("请输入邮箱和密码");
        return;
    }

    if (password.length < 6) {
        showMessage("密码至少需要 6 位");
        return;
    }

    showMessage("正在注册……");

    const { data, error } =
        await supabase.auth.signUp({
            email,
            password
        });

    if (error) {
        showMessage("注册失败：" + error.message);
        return;
    }

    showMessage(
        "注册成功！请检查邮箱并完成验证。"
    );
}


function showMessage(text) {

    document.getElementById("message")
        .textContent = text;
}

</script>

</body>
</html>
