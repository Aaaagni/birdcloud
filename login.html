<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>登录 | BirdCloud</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: linear-gradient(
        180deg,
        #dff5ff,
        #f8fcff
    );
}

.login-box {
    width: min(90%, 420px);
    padding: 35px 28px;

    background: rgba(255,255,255,0.9);
    border-radius: 24px;

    box-shadow:
        0 15px 45px rgba(0,0,0,0.12);

    text-align: center;
}

.logo {
    font-size: 42px;
    margin-bottom: 10px;
}

h1 {
    margin: 0;
    color: #234;
}

.subtitle {
    color: #789;
    margin-bottom: 14px;
}

#ready {
    font-size: 13px;
    color: #4c9ab5;
    margin-bottom: 14px;
    min-height: 18px;
}

input {
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 14px;

    border: 1px solid #d7e3ea;
    border-radius: 12px;

    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #72bcd4;
}

button {
    width: 100%;
    padding: 14px;

    border: none;
    border-radius: 12px;

    font-size: 16px;
    cursor: pointer;

    background: #72bcd4;
    color: white;

    margin-top: 5px;
}

button:hover {
    opacity: 0.9;
}

.register-btn {
    display: block;
    width: 100%;
    padding: 14px;
    margin-top: 5px;
    background: transparent;
    color: #4c9ab5;
    text-decoration: none;
    border-radius: 12px;
    font-size: 16px;
}

.register-btn:hover {
    opacity: 0.9;
}

#message {
    min-height: 24px;
    margin-top: 18px;
    font-size: 14px;
}
</style>

</head>

<body>

<div class="login-box">

    <div class="logo">🐦</div>

    <h1>BirdCloud</h1>

    <div class="subtitle">
        登录你的鸟窝
    </div>

    <div id="ready">页面加载中 (HTML v6)……</div>

    <input
        type="email"
        id="email"
        placeholder="邮箱"
    >

    <input
        type="password"
        id="password"
        placeholder="密码"
    >

    <button id="loginBtn">
        登录
    </button>

    <a
        class="register-btn"
        href="signup.html"
    >
        注册账号
    </a>

    <div id="message"></div>

</div>

<!-- Supabase 本地库 -->
<script src="vendor/supabase.min.js"></script>

<script>
(function () {

    function setReady(text) {
        var el = document.getElementById("ready");
        if (el) el.textContent = text;
    }

    function showMessage(text) {
        var el = document.getElementById("message");
        if (el) el.textContent = text;
    }

    // 最先注册全局错误捕获：任何脚本错误都会显示出来
    window.addEventListener("error", function (e) {
        setReady("脚本错误：" + e.message);
    });

    // 初始化（try-catch 包裹，任何一步失败都有明确提示）
    var supabase = null;
    try {
        if (!window.supabase || typeof window.supabase.createClient !== "function") {
            setReady("错误：Supabase 库未加载");
        } else {
            supabase = window.supabase.createClient(
                "https://ljgnwfswcqrzbetshocz.supabase.co",
                "sb_publishable_wxkURA_31W9WNHZkj-RJzg_WaVoLszA"
            );
            setReady("页面就绪 (v6)，脚本执行成功");
        }
    } catch (err) {
        setReady("初始化失败：" + err.message);
    }

    // 登录
    var login = async function () {
        if (!supabase) {
            showMessage("Supabase 客户端未就绪，请刷新重试");
            return;
        }

        var email = document.getElementById("email").value.trim();
        var password = document.getElementById("password").value;

        if (!email || !password) {
            showMessage("请输入邮箱和密码");
            return;
        }

        showMessage("正在登录……");

        try {
            var result = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (result.error) {
                showMessage("登录失败：" + result.error.message);
                return;
            }

            showMessage("登录成功！正在进入个人主页……");

            setTimeout(function () {
                window.location.href = "profile.html";
            }, 500);

        } catch (err) {
            showMessage("登录异常：" + err.message);
        }
    };

    // 按钮事件绑定
    try {
        document.getElementById("loginBtn")
            .addEventListener("click", login);
    } catch (err) {
        setReady("按钮绑定失败：" + err.message);
    }

})();
</script>

</body>
</html>
