<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公共相册 · 全部图片 | BirdCloud</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 覆盖 style.css 的 .container 三列网格，改为整行流式布局并加宽 */
        main.container {
            width: 92%;
            max-width: 1400px;
            display: block;
            margin-bottom: 60px;
        }

        .panel {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            padding: 28px 24px 34px;
        }

        .page-head {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 12px;
            margin: 0 0 4px;
        }

        .page-head h2 {
            margin: 0;
            font-size: 28px;
            color: #345;
        }

        .page-head .crumb {
            font-size: 13px;
            color: #99a;
        }

        .page-sub {
            margin: 8px 0 20px;
            font-size: 14px;
            color: #789;
            line-height: 1.6;
        }

        .btn-back {
            display: inline-block;
            margin-bottom: 20px;
            padding: 9px 18px;
            border-radius: 10px;
            background: #eef4f8;
            color: #3a6b82;
            font-size: 14px;
            text-decoration: none;
            transition: background 0.15s;
        }

        .btn-back:hover {
            background: #e2eef5;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        @media (max-width: 1200px) {
            .gallery-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 768px) {
            .gallery-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 480px) {
            .gallery-grid { grid-template-columns: 1fr; }
        }

        .gallery-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
        }

        .gallery-item img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
            cursor: zoom-in;
            background: #eef4f8;
        }

        /* ---- 多图轮播（一篇帖子多张图） ---- */
        .photo-slider {
            position: relative;
            height: 160px;
            overflow: hidden;
            background: #eef4f8;
        }

        .photo-slider .slider-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.25s;
            cursor: zoom-in;
        }

        .photo-slider .slider-img.active {
            opacity: 1;
        }

        .slider-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 26px;
            height: 26px;
            padding: 0 0 2px;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.42);
            color: #fff;
            font-size: 17px;
            line-height: 1;
            cursor: pointer;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slider-nav:hover {
            background: rgba(0, 0, 0, 0.6);
        }

        .slider-nav.prev { left: 6px; }
        .slider-nav.next { right: 6px; }

        .slider-count {
            position: absolute;
            right: 6px;
            bottom: 6px;
            z-index: 3;
            padding: 2px 7px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 11px;
            line-height: 1.5;
        }

        .slider-dots {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 8px;
            z-index: 3;
            display: flex;
            justify-content: center;
            gap: 5px;
            pointer-events: none;
        }

        .slider-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.55);
        }

        .slider-dot.on {
            background: #fff;
        }

        .del-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            border: none;
            border-radius: 8px;
            background: rgba(220, 53, 69, 0.88);
            color: #fff;
            font-size: 14px;
            width: 30px;
            height: 30px;
            line-height: 1;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.15s;
            z-index: 2;
        }

        .gallery-item:hover .del-btn {
            opacity: 1;
        }

        .del-btn:hover {
            background: #c82333;
        }

        .del-btn[data-pending="1"] {
            width: auto;
            padding: 0 10px;
            font-size: 13px;
            background: #c82333;
            opacity: 1;
        }

        .gallery-item .caption {
            padding: 10px 12px;
        }

        .caption .cap-author {
            font-size: 14px;
            color: #345;
            font-weight: 600;
        }

        .caption .cap-meta {
            font-size: 12px;
            color: #789;
            margin-top: 3px;
            line-height: 1.5;
        }

        .caption .cap-note {
            font-size: 13px;
            color: #567;
            margin-top: 6px;
            line-height: 1.5;
            background: #f3f9fc;
            border-left: 3px solid #72bcd4;
            padding: 5px 8px;
            border-radius: 0 6px 6px 0;
            word-break: break-word;
        }

        .empty {
            color: #99a;
            padding: 60px 20px;
            text-align: center;
            font-size: 18px;
            line-height: 2;
            grid-column: 1 / -1;
        }

        #status {
            min-height: 20px;
            margin: 20px 0 0;
            font-size: 15px;
            color: #4c9ab5;
            text-align: center;
        }

        @media (max-width: 900px) {
            /* 无 hover：删除按钮常显 */
            .del-btn { opacity: 1; }
        }

        @media (max-width: 480px) {
            .gallery-item img { height: 220px; }
            .photo-slider { height: 220px; }
            .slider-nav { width: 32px; height: 32px; font-size: 20px; }
        }
    </style>
</head>
<body>
    <!-- Weather switch -->
    <div class="weather-switch" id="weatherSwitch">
        <button data-mode="sunny" onclick="window.setWeather&&window.setWeather('sunny')">☀️ 晴天</button>
        <button data-mode="cloudy" onclick="window.setWeather&&window.setWeather('cloudy')">☁️ 阴天</button>
        <button data-mode="rainy" onclick="window.setWeather&&window.setWeather('rainy')">🌧️ 雨天</button>
        <button data-mode="night" onclick="window.setWeather&&window.setWeather('night')">🌙 夜晚</button>
    </div>

    <header>
        <div class="logo">🐦 BirdCloud 观鸟笔记</div>
        <nav>
            <a href="index.html">首页</a>
            <a href="records.html">观鸟记录本</a>
            <a href="forum.html">观鸟地点</a>
            <a href="gallery.html" class="active">观鸟相册</a>
            <a href="tools.html">实用工具</a>
            <a href="fun.html">随便玩玩</a>
            <a href="login.html" id="nest-link">鸟窝入住</a>
            <a href="thanks.html">感谢名单</a>
            <a href="../birdcloud-library/index.html">鸟云图书馆</a>
        </nav>
    </header>

    <main class="container">
        <section class="panel gallery-panel">
            <a class="btn-back" href="gallery.html">← 返回观鸟相册</a>
            <div class="page-head">
                <h2>🌍 公共相册 · 全部图片</h2>
                <span class="crumb">观鸟相册 / 公共相册</span>
            </div>
            <p class="page-sub">这里汇集所有鸟友发布的公共照片，按发布时间从新到旧排列。点击图片可查看原图。</p>

            <div id="grid" class="gallery-grid">
                <div class="empty">加载中……</div>
            </div>
            <div id="status"></div>
        </section>
    </main>

    <footer>
        <p>BirdCloud 观鸟笔记 © 2026</p>
    </footer>

    <script src="vendor/supabase.min.js"></script>
    <script>
    (function () {

        var BUCKET_PUBLIC = "bird-public";
        var SUPABASE_URL = "https://ljgnwfswcqrzbetshocz.supabase.co";
        var SUPABASE_KEY = "sb_publishable_wxkURA_31W9WNHZkj-RJzg_WaVoLszA";
        // 单次最多加载的张数（避免一次拉取过多）
        var MAX_ITEMS = 500;

        var supabase = null;
        var isLoggedIn = false;
        var currentUserId = "";
        var currentEmail = "";
        var isAdmin = false;
        // 管理员：可删除公共相册里任意照片
        var ADMIN_EMAIL = "1878646255@qq.com";

        var grid = document.getElementById("grid");
        var statusEl = document.getElementById("status");

        function setStatus(msg, isError) {
            if (!statusEl) return;
            statusEl.textContent = msg || "";
            statusEl.style.color = isError ? "#d1493f" : "#4c9ab5";
        }

        function esc(s) {
            return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
                .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        window.addEventListener("error", function (e) {
            setStatus("页面脚本错误：" + e.message, true);
        });

        try {
            if (!window.supabase || typeof window.supabase.createClient !== "function") {
                setStatus("错误：Supabase 库未加载", true);
            } else {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
        } catch (err) {
            setStatus("初始化失败：" + err.message, true);
        }

        if (supabase) {
            supabase.auth.getSession().then(function (res) {
                isLoggedIn = !!(res.data && res.data.session);
                if (isLoggedIn && res.data.session.user) {
                    currentUserId = res.data.session.user.id;
                    currentEmail = (res.data.session.user.email || "").toLowerCase();
                    isAdmin = currentEmail === ADMIN_EMAIL;
                }
                var nest = document.getElementById("nest-link");
                if (nest) {
                    if (isLoggedIn) {
                        nest.href = "profile.html";
                        nest.textContent = "我的鸟窝";
                    } else {
                        nest.href = "login.html";
                        nest.textContent = "鸟窝入住";
                    }
                }
                loadAllPhotos();
            });
        }

        // 加载公共相册的全部照片
        function loadAllPhotos() {
            if (!supabase) return;
            setStatus("正在加载全部图片……");

            supabase.from("photos")
                .select("*")
                .eq("bucket", "public")
                .order("created_at", { ascending: false })
                .limit(MAX_ITEMS)
                .then(function (res) {
                    if (res.error) {
                        var msg = res.error.message || "";
                        if (msg.indexOf("does not exist") > -1 || msg.indexOf("relation") > -1) {
                            grid.innerHTML = '<div class="empty">📦 相册数据库尚未配置<br>' +
                                '请在 Supabase 控制台执行 <b>gallery-v2.sql</b></div>';
                        } else {
                            grid.innerHTML = '<div class="empty">相册加载失败：' + esc(msg) + '</div>';
                        }
                        setStatus("", false);
                        return;
                    }

                    var rows = res.data || [];
                    if (rows.length === 0) {
                        grid.innerHTML = '<div class="empty">🐦 公共相册还是空的<br>' +
                            '<a href="gallery.html" style="color:#4c9ab5;">返回相册，登录后发布第一张照片</a></div>';
                        setStatus("共 0 张照片", false);
                        return;
                    }

                    var items = [];
                    for (var i = 0; i < rows.length; i++) {
                        items.push({
                            row: rows[i],
                            url: SUPABASE_URL + "/storage/v1/object/public/" + BUCKET_PUBLIC + "/" + encodeURI(rows[i].path)
                        });
                    }
                    renderGrid(items, rows.length);
                });
        }

        // ---- 多图帖子：按文件名里的 group 标识聚合 ----
        var GROUP_RE = /(?:^|\/)p([a-z0-9]{4,})-(\d+)\./;

        function groupKeyOf(row) {
            var m = GROUP_RE.exec(row.path || "");
            return m ? "g:" + m[1] : "s:" + row.id;
        }

        function groupIndex(row) {
            var m = GROUP_RE.exec(row.path || "");
            return m ? parseInt(m[2], 10) : 0;
        }

        function groupPosts(items) {
            var map = {}, order = [];
            for (var i = 0; i < items.length; i++) {
                var k = groupKeyOf(items[i].row);
                if (!map[k]) {
                    map[k] = { key: k, items: [] };
                    order.push(k);
                }
                map[k].items.push(items[i]);
            }
            var posts = [];
            for (var j = 0; j < order.length; j++) {
                var p = map[order[j]];
                p.items.sort(function (a, b) { return groupIndex(a.row) - groupIndex(b.row); });
                posts.push(p);
            }
            return posts;
        }

        function slideStep(wrap, dir) {
            var imgs = wrap.querySelectorAll(".slider-img");
            if (imgs.length < 2) return;
            var cur = 0;
            for (var i = 0; i < imgs.length; i++) {
                if (imgs[i].classList.contains("active")) { cur = i; break; }
            }
            var next = (cur + dir + imgs.length) % imgs.length;
            imgs[cur].classList.remove("active");
            imgs[next].classList.add("active");
            var c = wrap.querySelector(".slider-count");
            if (c) c.textContent = (next + 1) + " / " + imgs.length;
            var dots = wrap.querySelectorAll(".slider-dot");
            for (var d = 0; d < dots.length; d++) {
                dots[d].classList.toggle("on", d === next);
            }
        }

        function buildPost(post) {
            var first = post.items[0].row;
            var multi = post.items.length > 1;
            var isOwner = isLoggedIn && first.user_id === currentUserId;
            // 管理员可删除任何人的公共照片；其他人只能删自己的
            var canDelete = isOwner || isAdmin;

            var ids = [], paths = [];
            for (var k = 0; k < post.items.length; k++) {
                ids.push(post.items[k].row.id);
                paths.push(post.items[k].row.path);
            }

            var delBtn = canDelete
                ? '<button class="del-btn" data-ids="' + esc(JSON.stringify(ids)) +
                  '" data-paths="' + esc(JSON.stringify(paths)) + '" title="删除这篇照片">✕</button>'
                : "";

            var author = first.author_name || "匿名鸟友";
            var place = first.place || "未填写";
            var date = first.taken_at || "未知日期";
            var note = first.note || "";
            var noteHtml = note ? '<div class="cap-note">📝 ' + esc(note) + '</div>' : "";

            var imgs = "";
            for (var j = 0; j < post.items.length; j++) {
                var it = post.items[j];
                imgs += '<img class="slider-img' + (j === 0 ? " active" : "") + '" src="' + esc(it.url) + '"' +
                    ' data-url="' + esc(it.url) + '" data-path="' + esc(it.row.path) + '"' +
                    ' data-id="' + it.row.id + '" alt="' + esc(author) + ' 拍摄" loading="lazy">';
            }

            var nav = "";
            if (multi) {
                var dots = "";
                for (var d = 0; d < post.items.length; d++) {
                    dots += '<i class="slider-dot' + (d === 0 ? " on" : "") + '"></i>';
                }
                nav = '<button class="slider-nav prev" type="button" aria-label="上一张">‹</button>' +
                      '<button class="slider-nav next" type="button" aria-label="下一张">›</button>' +
                      '<span class="slider-count">1 / ' + post.items.length + '</span>' +
                      '<div class="slider-dots">' + dots + '</div>';
            }

            return '<div class="gallery-item">' + delBtn +
                '<div class="photo-slider" data-total="' + post.items.length + '">' + imgs + nav + '</div>' +
                '<div class="caption">' +
                    '<div class="cap-author">🐦 ' + esc(author) + '</div>' +
                    '<div class="cap-meta">📍 ' + esc(place) + '<br>📅 ' + esc(date) +
                        (multi ? ' · 🖼️ ' + post.items.length + ' 张' : '') + '</div>' +
                    noteHtml +
                '</div></div>';
        }

        function renderGrid(items, totalPhotos) {
            var posts = groupPosts(items);
            var html = "";
            for (var i = 0; i < posts.length; i++) {
                html += buildPost(posts[i]);
            }
            grid.innerHTML = html;

            var photos = typeof totalPhotos === "number" ? totalPhotos : items.length;
            var limitText = photos >= MAX_ITEMS ? "（仅显示最新 " + MAX_ITEMS + " 张）" : "";
            setStatus("共 " + photos + " 张照片 · " + posts.length + " 篇" + limitText, false);
        }

        // 删除（整篇）：两段式确认
        var pendingDelete = null;
        var suppressClick = false;
        var touchStartX = 0, touchStartY = 0;
        var touchWrap = null;

        grid.addEventListener("touchstart", function (e) {
            if (e.touches.length !== 1) return;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            touchWrap = e.target.closest ? e.target.closest(".photo-slider") : null;
        }, { passive: true });

        grid.addEventListener("touchend", function (e) {
            if (!touchWrap || e.changedTouches.length !== 1) return;
            var dx = e.changedTouches[0].clientX - touchStartX;
            var dy = e.changedTouches[0].clientY - touchStartY;
            var wrap = touchWrap;
            touchWrap = null;
            if (+wrap.getAttribute("data-total") < 2) return;
            if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return;
            slideStep(wrap, dx < 0 ? 1 : -1);
            suppressClick = true;
        }, { passive: true });

        grid.addEventListener("click", function (e) {
            if (suppressClick) {
                suppressClick = false;
                return;
            }

            var navEl = e.target.closest ? e.target.closest(".slider-nav") : null;
            if (navEl) {
                slideStep(navEl.parentNode, navEl.classList.contains("next") ? 1 : -1);
                return;
            }

            var imgEl = e.target.closest ? e.target.closest(".slider-img") : null;
            if (imgEl) {
                window.open(imgEl.getAttribute("data-url") || imgEl.src, "_blank");
                return;
            }

            var btn = e.target.closest ? e.target.closest(".del-btn") : null;
            if (!btn) return;

            var idsStr = btn.getAttribute("data-ids") || "";

            if (pendingDelete !== idsStr) {
                var prev = grid.querySelector('.del-btn[data-pending="1"]');
                if (prev) {
                    prev.textContent = "✕";
                    prev.removeAttribute("data-pending");
                }
                pendingDelete = idsStr;
                btn.textContent = "确认?";
                btn.setAttribute("data-pending", "1");
                return;
            }

            pendingDelete = null;
            btn.textContent = "✕";
            btn.removeAttribute("data-pending");

            var ids = [], paths = [];
            try { ids = JSON.parse(idsStr); } catch (e1) {}
            try { paths = JSON.parse(btn.getAttribute("data-paths") || "[]"); } catch (e2) {}
            if (!ids.length) return;

            setStatus("正在删除……");

            supabase.from("photos").delete().in("id", ids).select().then(function (res) {
                if (res.error) {
                    setStatus("删除记录失败：" + res.error.message, true);
                    return;
                }
                var deleted = res.data || [];
                if (deleted.length === 0) {
                    setStatus("没有权限删除：只有照片发布者或管理员可以删除", true);
                    loadAllPhotos();
                    return;
                }
                var goneIds = {};
                for (var di = 0; di < deleted.length; di++) goneIds[deleted[di].id] = true;
                var gonePaths = [];
                for (var pi = 0; pi < ids.length; pi++) {
                    if (goneIds[ids[pi]]) gonePaths.push(paths[pi]);
                }
                supabase.storage.from(BUCKET_PUBLIC).remove(gonePaths).then(function (up) {
                    if (deleted.length < ids.length) {
                        setStatus("已删除 " + deleted.length + " 张，另有 " +
                            (ids.length - deleted.length) + " 张没有权限", true);
                        loadAllPhotos();
                        return;
                    }
                    if (up.error) {
                        setStatus("已从相册列表移除，但文件删除失败：" + up.error.message, true);
                        return;
                    }
                    setStatus("已删除");
                    loadAllPhotos();
                });
            });
        });

    })();
    </script>
</body>
</html>
