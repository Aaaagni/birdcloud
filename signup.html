<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>注册账号 | BirdCloud</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #e8f7ff, #f8fbff);
        }

        .box {
            width: min(90%, 420px);
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .logo {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: 30px;
            color: #222;
        }

        .subtitle {
            margin: 8px 0 28px;
            color: #777;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 14px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #4da9d8;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            background: #4da9d8;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            margin-top: 15px;
            color: #666;
            font-size: 14px;
        }

        .back {
            display: block;
            margin-top: 22px;
            color: #4da9d8;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="logo">🦩</div>

        <h1>BirdCloud</h1>

        <div class="subtitle">
            创建你的鸟窝账号
        </div>

        <input
            type="email"
            id="email"
            placeholder="邮箱"
        >

        <input
            type="password"
            id="password"
            placeholder="密码"
        >

        <button onclick="register()">
            注册账号
        </button>

        <div id="message"></div>

        <a class="back" href=" ">
            已有账号？返回登录
        </a >

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL = "https://jgnwfswcqrzbetshocz.supabase.co";

        const SUPABASE_ANON_KEY = "sb_publishable_wxkURA_31W9WNHZkj-RJzg_WaVoLszA";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


        async function register() {

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");


            if (!email || !password) {

                message.textContent =
                    "请输入邮箱和密码";

                return;
            }


            if (password.length < 6) {

                message.textContent =
                    "密码至少需要 6 位";

                return;
            }


            message.textContent =
                "正在注册……";


            const { data, error } =
                await supabaseClient.auth.signUp({
                    email: email,
                    password: password
                });


            if (error) {

                message.textContent =
                    "注册失败：" + error.message;

                return;
            }


            message.textContent =
                "注册成功！请检查邮箱完成验证。";

        }

    </script>

</body>

</html>
