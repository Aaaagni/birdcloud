<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>注册账号 | BirdCloud</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #e8f7ff, #f8fbff);
        }

        .box {
            width: min(90%, 420px);
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .logo {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: 30px;
            color: #222;
        }

        .subtitle {
            margin: 8px 0 28px;
            color: #777;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 14px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #4da9d8;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            background: #4da9d8;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            margin-top: 15px;
            color: #666;
            font-size: 14px;
            min-height: 20px;
        }

        .back {
            display: block;
            margin-top: 22px;
            color: #4da9d8;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="logo">🦩</div>

        <h1>BirdCloud</h1>

        <div class="subtitle">
            创建你的鸟窝账号
        </div>

        <input
            type="email"
            id="email"
            placeholder="邮箱"
        >

        <input
            type="password"
            id="password"
            placeholder="密码"
        >

        <button id="registerBtn">
            注册账号
        </button>

        <div id="message"></div>

        <a class="back" href="login.html">
            已有账号？返回登录
        </a>

    </div>


    <script src="vendor/supabase.min.js"></script>

    <script>
(function () {

    function showMessage(text) {
        var el = document.getElementById("message");
        if (el) el.textContent = text;
    }

    // 最先注册全局错误捕获
    window.addEventListener("error", function (e) {
        showMessage("页面脚本错误：" + e.message);
    });

    // 初始化（try-catch 包裹）
    var supabaseClient = null;
    try {
        if (!window.supabase || typeof window.supabase.createClient !== "function") {
            showMessage("错误：Supabase 库未加载");
        } else {
            supabaseClient = window.supabase.createClient(
                "https://ljgnwfswcqrzbetshocz.supabase.co",
                "sb_publishable_wxkURA_31W9WNHZkj-RJzg_WaVoLszA"
            );
        }
    } catch (err) {
        showMessage("初始化失败：" + err.message);
    }

    // 注册
    var register = async function () {
        if (!supabaseClient) {
            showMessage("Supabase 客户端未就绪，请刷新重试");
            return;
        }

        var email = document.getElementById("email").value.trim();
        var password = document.getElementById("password").value;

        if (!email || !password) {
            showMessage("请输入邮箱和密码");
            return;
        }

        if (password.length < 6) {
            showMessage("密码至少需要 6 位");
            return;
        }

        showMessage("正在注册……");

        try {
            var result = await supabaseClient.auth.signUp({
                email: email,
                password: password
            });

            if (result.error) {
                showMessage("注册失败：" + result.error.message);
                return;
            }

            if (result.data.session) {

                // 已自动登录，直接进入个人主页
                showMessage("注册成功！正在进入你的鸟窝……");

                setTimeout(function () {
                    window.location.href = "profile.html";
                }, 800);

            } else {

                // 项目开启邮箱确认时的兜底提示
                showMessage("注册成功！请检查邮箱完成验证。");

            }

        } catch (err) {
            showMessage("注册异常：" + err.message);
        }
    };

    // 按钮事件绑定
    try {
        document.getElementById("registerBtn")
            .addEventListener("click", register);
    } catch (err) {
        showMessage("按钮绑定失败：" + err.message);
    }

})();
    </script>

</body>

</html>
