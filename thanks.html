<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>感谢名单 | BirdCloud</title>
    <link rel="stylesheet" href="style.css">
    <style>
        main.container {
            width: 92%;
            max-width: 900px;
            display: block;
        }

        .thanks-hero {
            text-align: center;
            padding: 50px 20px 30px;
        }

        .thanks-hero h1 {
            color: #4682b4;
            font-size: 32px;
            margin-bottom: 12px;
        }

        .thanks-hero p {
            color: #668;
            font-size: 15px;
        }

        .thanks-card {
            background: #fff;
            border: 1px solid #dceef6;
            border-radius: 12px;
            padding: 60px 30px;
            text-align: center;
            margin-bottom: 60px;
            box-shadow: 0 4px 12px rgba(173, 216, 230, 0.2);
        }

        .thanks-card .placeholder-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .thanks-card h2 {
            color: #4682b4;
            font-size: 20px;
            margin-bottom: 10px;
        }

        .thanks-card p {
            color: #8199a3;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <header>
        <div class="logo">🐦 BirdCloud 观鸟笔记</div>
        <nav>
            <a href="index.html">首页</a >
            <a href="records.html">观鸟记录本</a >
            <a href="forum.html">观鸟地点</a >
            <a href="gallery.html">观鸟相册</a >
            <a href="tools.html">实用工具</a >
            <a href="login.html" id="nest-link">鸟窝入住</a >
            <a href="thanks.html" class="active">感谢名单</a >
        </nav>
    </header>

    <!-- 感谢名单板块 -->
    <main class="container">
        <section class="thanks-hero">
            <h1>🙏 感谢名单</h1>
            <p>感谢每一位支持 BirdCloud 的朋友，名单陆续补充中</p >
        </section>

        <section class="thanks-card">
            <div class="placeholder-icon">🐦</div>
            <h2>名单整理中</h2>
            <p>感谢名单内容正在整理，敬请期待</p >
        </section>
    </main>

    <footer>
        <p>BirdCloud 观鸟笔记 © 2026</p >
    </footer>
    <script src="vendor/supabase.min.js"></script>

<script>
(function () {

    var SUPABASE_URL = "https://ljgnwfswcqrzbetshocz.supabase.co";
    var SUPABASE_KEY = "sb_publishable_wxkURA_31W9WNHZkj-RJzg_WaVoLszA";
    var supabase = null;

    try {
        if (window.supabase && typeof window.supabase.createClient === "function") {
            supabase = window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );
        }
    } catch (e) {
        console.log("Supabase 初始化失败：" + e.message);
    }

    // 检查登录状态：已登录则把"鸟窝入住"改为"我的鸟窝"并指向个人主页
    if (supabase) {
        supabase.auth.getSession().then(function (res) {

            var link = document.getElementById("nest-link");
            if (!link) return;

            if (res.data && res.data.session) {
                link.href = "profile.html";
                link.textContent = "我的鸟窝";
            } else {
                link.href = "login.html";
                link.textContent = "鸟窝入住";
            }

        });
    }

})();
</script>
</body>
</html>
