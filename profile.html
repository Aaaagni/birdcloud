<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>我的鸟窝 | BirdCloud</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    min-height: 100vh;

    background:
        linear-gradient(
            180deg,
            #dff5ff 0%,
            #f7fcff 55%,
            #ffffff 100%
        );

    color: #29404b;
}

/* 顶部 */

.header {
    height: 70px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 6%;

    background: rgba(255,255,255,0.78);

    backdrop-filter: blur(12px);

    border-bottom: 1px solid rgba(100,150,170,0.12);
}

.logo {
    font-size: 22px;
    font-weight: 700;

    color: #357d96;

    text-decoration: none;
}

.back {
    color: #5f8796;

    text-decoration: none;

    font-size: 14px;
}


/* 页面 */

.container {
    width: min(92%, 760px);

    margin: 45px auto;
}


/* 个人卡片 */

.profile-card {

    background: rgba(255,255,255,0.9);

    border-radius: 28px;

    padding: 35px;

    box-shadow:
        0 15px 45px rgba(50,100,120,0.12);

    text-align: center;
}


/* 头像 */

.avatar {

    width: 100px;
    height: 100px;

    margin: 0 auto 18px;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #d9f2fa;

    font-size: 48px;
}


/* 用户 */

#username {

    font-size: 25px;

    margin-bottom: 8px;

    color: #29404b;
}

#email {

    font-size: 14px;

    color: #8199a3;
}


/* 简介 */

.bio {

    margin: 18px auto 0;

    color: #708891;

    font-size: 14px;

    max-width: 500px;
}


/* 数据 */

.stats {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;

    margin-top: 30px;
}

.stat {

    padding: 18px 8px;

    background: #f2f9fb;

    border-radius: 18px;
}

.stat-number {

    display: block;

    font-size: 23px;

    font-weight: 700;

    color: #438aa1;
}

.stat-label {

    display: block;

    margin-top: 5px;

    font-size: 13px;

    color: #8199a3;
}


/* 探索进度 */

.prog-box {

    margin-top: 24px;

    padding: 18px 20px;

    background: #f2f9fb;

    border-radius: 18px;

    text-align: left;
}

.prog-title {

    font-size: 13px;

    color: #8199a3;

    margin-bottom: 12px;
}

.prog-row {

    margin-bottom: 10px;
}

.prog-row:last-child {

    margin-bottom: 0;
}

.prog-label {

    display: flex;

    justify-content: space-between;

    font-size: 13px;

    color: #5b7480;

    margin-bottom: 5px;
}

.prog-bar-wrap {

    height: 8px;

    background: #e3eef3;

    border-radius: 5px;

    overflow: hidden;
}

.prog-bar {

    height: 100%;

    width: 0%;

    background: #2c9e6b;

    border-radius: 5px;

    transition: width 0.4s;
}


/* 快捷入口 */

.shortcuts {

    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 10px;

    margin-top: 24px;

    text-align: center;
}

.shortcut {

    padding: 12px 8px;

    background: #eef7fb;

    border: 1px solid #dceef6;

    border-radius: 14px;

    color: #2c6e86;

    font-size: 14px;

    text-decoration: none;

    transition: background 0.2s;
}

.shortcut:hover {

    background: #dff1f8;
}


/* 按钮 */

.actions {

    margin-top: 24px;

    display: flex;

    justify-content: center;

    gap: 12px;
}

button {

    border: none;

    padding: 12px 24px;

    border-radius: 14px;

    font-size: 15px;

    cursor: pointer;
}

.edit-btn {

    background: #75bfd4;

    color: white;
}

.logout-btn {

    background: #edf3f5;

    color: #607982;
}


/* 手机 */

@media (max-width: 600px) {

    .container {

        width: 92%;

        margin: 25px auto;
    }

    .profile-card {

        padding: 28px 18px;

        border-radius: 24px;
    }

    .stats {

        grid-template-columns: 1fr;
    }

    .shortcuts {

        grid-template-columns: 1fr;
    }

    .actions {

        flex-direction: column;
    }

    button {

        width: 100%;
    }

}

</style>

</head>


<body>


<header class="header">

    <a
        class="logo"
        href="index.html">
        🐦 BirdCloud
    </a >

    <a
        class="back"
        href="index.html">
        返回首页
    </a >

    <a
        class="back"
        href="thanks.html">
        感谢名单
    </a >

</header>


<main class="container">


<section class="profile-card">


    <div class="avatar">
        🐦
    </div>


    <h1 id="username">
        我的鸟窝
    </h1>


    <p id="email">
        正在加载……
    </p >


    <p
        class="bio"
        id="bio">
        欢迎来到我的鸟窝
    </p >


    <div class="stats">

        <div class="stat">

            <span
                class="stat-number"
                id="statRecords">
                –
            </span>

            <span class="stat-label">
                观鸟记录
            </span>

        </div>


        <div class="stat">

            <span
                class="stat-number"
                id="statPhotos">
                –
            </span>

            <span class="stat-label">
                我的照片
            </span>

        </div>


        <div class="stat">

            <span
                class="stat-number"
                id="statChecklist">
                –
            </span>

            <span class="stat-label">
                清单进度
            </span>

        </div>

    </div>


    <!-- 探索进度：与实用工具页数据联动 -->
    <div class="prog-box">

        <div class="prog-title">
            🌱 探索进度
        </div>

        <div class="prog-row">

            <div class="prog-label">
                <span>观鸟清单</span>
                <span id="checkCount">0 / 46</span>
            </div>

            <div class="prog-bar-wrap">
                <div class="prog-bar" id="checkBar"></div>
            </div>

        </div>

        <div class="prog-row">

            <div class="prog-label">
                <span>冷知识收集</span>
                <span id="tipsCount">0 / 30</span>
            </div>

            <div class="prog-bar-wrap">
                <div class="prog-bar" id="tipsBar"></div>
            </div>

        </div>

    </div>


    <!-- 快捷入口：与全站功能同步 -->
    <div class="shortcuts">

        <a class="shortcut" href="records.html">
            📒 观鸟记录本
        </a>

        <a class="shortcut" href="gallery.html">
            📷 观鸟相册
        </a>

        <a class="shortcut" href="forum.html">
            📍 观鸟地点
        </a>

        <a class="shortcut" href="tools.html">
            🛠️ 实用工具
        </a>

    </div>


    <div class="actions">

        <button
            class="edit-btn"
            onclick="editProfile()">
            编辑资料
        </button>

        <button
            class="logout-btn"
            onclick="logout()">
            退出登录
        </button>

    </div>


</section>


</main>


<!-- Supabase -->

<script src="vendor/supabase.min.js"></script>

<script>

const SUPABASE_URL =
    "https://ljgnwfswcqrzbetshocz.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_wxkURA_31W9WNHZkj-RJzg_WaVoLszA";


const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* 检查登录 */

async function loadProfile() {

    const {
        data: { user }
    } = await supabase.auth.getUser();


    if (!user) {

        window.location.href =
            "login.html";

        return;
    }


    document.getElementById("email")
        .textContent = user.email;


    const username =
        user.email.split("@")[0];


    document.getElementById("username")
        .textContent =
            "🐦 " + username;


    /* 简介：读取账号资料（user_metadata.bio） */
    const bio =
        (user.user_metadata && user.user_metadata.bio) || "";

    const bioEl =
        document.getElementById("bio");

    if (bio) {

        bioEl.textContent = bio;

        bioEl.dataset.bio = bio;

    } else {

        bioEl.textContent = "欢迎来到我的鸟窝";

        bioEl.dataset.bio = "";
    }


    await loadStats(user);

    loadLocalProgress();

}


/* 真实统计：观鸟记录数 / 我的照片数（云数据） */

async function loadStats(user) {

    const query = (table) =>
        supabase.from(table)
            .select("id", { count: "exact", head: true })
            .eq("user_id", user.id);


    const [rec, ph] = await Promise.all([
        query("records"),
        query("photos")
    ]);


    document.getElementById("statRecords").textContent =
        rec.count != null ? rec.count : "–";

    document.getElementById("statPhotos").textContent =
        ph.count != null ? ph.count : "–";

}


/* 本地进度：观鸟清单 + 冷知识（与实用工具页共用 localStorage） */

function loadLocalProgress() {

    /* 观鸟清单：46 种（与 tools.html 图鉴同步） */
    let check = {};
    try {
        check = JSON.parse(
            localStorage.getItem("birdcloud-checklist")
        ) || {};
    } catch (e) { }


    const checkTotal = 46;

    const checkDone =
        Math.min(
            Object.keys(check).length,
            checkTotal
        );


    document.getElementById("statChecklist").textContent =
        checkDone + " / " + checkTotal;

    document.getElementById("checkCount").textContent =
        checkDone + " / " + checkTotal;

    document.getElementById("checkBar").style.width =
        (checkDone * 100 / checkTotal) + "%";


    /* 冷知识：30 条（与 tools.html 冷知识同步） */
    let tips = {};
    try {
        tips = JSON.parse(
            localStorage.getItem("birdcloud-tips-seen")
        ) || {};
    } catch (e) { }


    const tipsTotal = 30;

    const tipsDone =
        Math.min(
            Object.keys(tips).length,
            tipsTotal
        );


    document.getElementById("tipsCount").textContent =
        tipsDone + " / " + tipsTotal;

    document.getElementById("tipsBar").style.width =
        (tipsDone * 100 / tipsTotal) + "%";

}


/* 编辑资料：保存简介到账号资料（无需建表） */

async function editProfile() {

    const bioEl =
        document.getElementById("bio");

    const current =
        bioEl.dataset.bio || "";


    const value =
        prompt(
            "更新你的鸟窝简介：",
            current
        );


    if (value === null) return;


    const bio =
        value.trim();


    const { error } =
        await supabase.auth.updateUser({
            data: { bio: bio }
        });


    if (error) {

        alert(
            "保存失败：" +
            error.message
        );

        return;
    }


    if (bio) {

        bioEl.textContent = bio;

        bioEl.dataset.bio = bio;

    } else {

        bioEl.textContent = "欢迎来到我的鸟窝";

        bioEl.dataset.bio = "";
    }


    alert("简介已保存 🐦");

}


/* 退出 */

async function logout() {

    const { error } =
        await supabase.auth.signOut();


    if (error) {

        alert(
            "退出失败：" +
            error.message
        );

        return;
    }


    window.location.href =
        "index.html";
}


loadProfile();

</script>


</body>

</html>
