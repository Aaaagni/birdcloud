<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>观鸟记录本 - BirdCloud</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 覆盖 style.css 的 .container 网格布局，改为整行流式布局 */
        main.container {
            width: 92%;
            max-width: 1100px;
            display: block;
            margin-bottom: 60px;
        }

        .page-title {
            color: #4682b4;
            font-size: 26px;
            margin: 24px 0 6px;
        }

        .page-sub {
            color: #777;
            margin-bottom: 20px;
        }

        .empty-hint {
            color: #999;
            font-size: 14px;
            padding: 20px 0;
            text-align: center;
        }

        /* ---- 观鸟记录本 ---- */
        .record-form {
            display: grid;
            gap: 10px;
        }

        .record-form input[type="text"],
        .record-form input[type="date"] {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border: 1px solid #cfe3ee;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 12px;
            outline: none;
        }

        .record-form input:focus {
            border-color: #4682b4;
        }

        .record-list {
            margin-top: 16px;
            display: grid;
            gap: 10px;
        }

        .record-item {
            background: #f4fafd;
            border: 1px solid #dceef6;
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .record-item .r-info {
            flex: 1;
            min-width: 0;
        }

        .record-item .r-name {
            font-weight: bold;
            color: #2c5f8a;
        }

        .record-item .r-meta {
            font-size: 12px;
            color: #888;
            margin-top: 2px;
        }

        .record-item .r-note {
            font-size: 13px;
            color: #555;
            margin-top: 2px;
        }

        .record-del {
            background: none;
            border: none;
            color: #d1493f;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .record-del:hover {
            background: #fdecea;
        }

        .rec-photo-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .rec-photo-name {
            font-size: 12px;
            color: #888;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .rec-photo-preview {
            max-width: 96px;
            max-height: 96px;
            border-radius: 8px;
            border: 1px solid #dceef6;
        }

        .rec-photo-clear {
            background: none;
            border: none;
            color: #d1493f;
            font-size: 13px;
            cursor: pointer;
        }

        .record-item .r-photo {
            width: 64px;
            height: 64px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #dceef6;
            flex-shrink: 0;
        }

        /* ---- 登录锁提示 ---- */
        .lock-card {
            text-align: center;
            padding: 44px 20px;
        }

        .lock-card .lock-icon {
            font-size: 44px;
        }

        .lock-card p {
            color: #777;
            margin: 14px 0 22px;
            line-height: 1.9;
        }

        .lock-card .btn {
            display: inline-block;
            padding: 10px 28px;
            background: #4682b4;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-size: 15px;
        }

        .btn {
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">🐦 BirdCloud 观鸟笔记</div>
        <nav>
            <a href="index.html">首页</a>
            <a href="records.html" class="active">观鸟记录本</a>
            <a href="forum.html">观鸟地点</a>
            <a href="gallery.html">观鸟相册</a>
            <a href="tools.html">实用工具</a>
            <a href="login.html" id="nest-link">鸟窝入住</a>
        </nav>
    </header>

    <main class="container">
        <h1 class="page-title">📒 观鸟记录本</h1>
        <p class="page-sub">登录后使用，记录仅自己可见，可上传照片存入云端观鸟相册</p>

        <div class="card lock-card" id="lockCard" style="display:none">
            <div class="lock-icon">🔒</div>
            <p>记录本是私密的<br>请先登录，才能查看你的专属观鸟记录</p>
            <a class="btn" href="login.html?next=records.html">去登录</a>
        </div>

        <div class="card" id="recordCard" style="display:none">
            <div class="record-form">
                <input type="text" id="recName" placeholder="鸟种名称（如：白鹭）">
                <input type="text" id="recPlace" placeholder="观测地点（如：西湖湿地）">
                <input type="date" id="recDate">
                <input type="text" id="recNote" placeholder="备注（可选，如：3 只，清晨）">
                <div class="rec-photo-row">
                    <label class="btn" for="recPhoto">📷 添加照片</label>
                    <input type="file" id="recPhoto" accept="image/*" style="display:none">
                    <span id="recPhotoName" class="rec-photo-name"></span>
                    <img id="recPhotoPreview" class="rec-photo-preview" alt="照片预览" style="display:none">
                    <button id="recPhotoClear" class="rec-photo-clear" type="button" style="display:none">移除</button>
                </div>
                <button class="btn" id="addRec">添加记录</button>
            </div>
            <div class="record-list" id="recordList"></div>
        </div>
    </main>

    <footer>
        <p>BirdCloud 观鸟笔记 © 2026 · 记录美好观鸟时光，不打扰鸟类栖息</p>
    </footer>

    <script src="vendor/supabase.min.js"></script>
    <script>
    (function () {

        var SUPABASE_URL = "https://ljgnwfswcqrzbetshocz.supabase.co";
        var SUPABASE_KEY = "sb_publishable_wxkURA_31W9WNHZkj-RJzg_WaVoLszA";
        var BUCKET = "bird-gallery";
        var supabase = null;

        try {
            if (window.supabase && typeof window.supabase.createClient === "function") {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
        } catch (e) {
            console.log("Supabase 初始化失败：" + e.message);
        }

        // 登录态导航：已登录显示"我的鸟窝"
        if (supabase) {
            supabase.auth.getSession().then(function (res) {
                var link = document.getElementById("nest-link");
                if (!link) return;
                if (res.data && res.data.session) {
                    link.href = "profile.html";
                    link.textContent = "我的鸟窝";
                } else {
                    link.href = "login.html";
                    link.textContent = "鸟窝入住";
                }
            });
        }

        // ============ 观鸟记录本（云端私有 · Supabase 表，按账号隔离） ============
        var TABLE = "records";
        var STORE_KEY = "birdcloud-records"; // 仅用于迁移旧版存于本机的记录
        var isLoggedIn = false;
        var currentUserId = "";

        var recordCard = document.getElementById("recordCard");
        var lockCard = document.getElementById("lockCard");
        var recName = document.getElementById("recName");
        var recPlace = document.getElementById("recPlace");
        var recDate = document.getElementById("recDate");
        var recNote = document.getElementById("recNote");
        var addRec = document.getElementById("addRec");
        var recordList = document.getElementById("recordList");
        var recPhoto = document.getElementById("recPhoto");
        var recPhotoName = document.getElementById("recPhotoName");
        var recPhotoPreview = document.getElementById("recPhotoPreview");
        var recPhotoClear = document.getElementById("recPhotoClear");
        var pendingPhoto = null; // { out: Blob, fileName, isJpeg }

        // 日期默认今天
        if (recDate && !recDate.value) {
            recDate.value = new Date().toISOString().slice(0, 10);
        }

        function esc(s) {
            return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        function showRecordCard() {
            if (recordCard) recordCard.style.display = "";
            if (lockCard) lockCard.style.display = "none";
        }

        function showLockCard() {
            if (recordCard) recordCard.style.display = "none";
            if (lockCard) lockCard.style.display = "";
        }

        // 登录门禁：未登录只显示锁提示，登录后加载自己的记录
        if (supabase) {
            supabase.auth.getSession().then(function (res) {
                var session = res.data && res.data.session;
                isLoggedIn = !!session;
                if (isLoggedIn && session.user) {
                    currentUserId = session.user.id;
                    showRecordCard();
                    loadRecords();
                    maybeMigrateLocal();
                } else {
                    showLockCard();
                }
            });
        } else {
            showLockCard();
        }

        // 只读取当前账号的记录（user_id 由服务端 RLS 强制匹配）
        function loadRecords() {
            return supabase.from(TABLE).select("*")
                .eq("user_id", currentUserId)
                .order("created_at", { ascending: false })
                .then(function (res) {
                    if (res.error) {
                        var msg = res.error.message || "";
                        if (msg.indexOf("PGRST205") > -1 || msg.indexOf("does not exist") > -1) {
                            recordList.innerHTML = '<div class="empty-hint">📦 云端记录表尚未创建<br>需要在 Supabase 控制台执行建表 SQL（见项目 schema.sql）</div>';
                        } else {
                            recordList.innerHTML = '<div class="empty-hint">记录加载失败：' + esc(msg) + '</div>';
                        }
                        return [];
                    }
                    renderRecords(res.data || []);
                    return res.data || [];
                });
        }

        function renderRecords(rows) {
            if (!rows || rows.length === 0) {
                recordList.innerHTML = '<div class="empty-hint">还没有记录，添加第一条观鸟记录吧</div>';
                return;
            }
            var html = "";
            var photoRows = [];
            for (var i = 0; i < rows.length; i++) {
                var r = rows[i];
                if (r.photo) photoRows.push(r);
                html += '<div class="record-item">' +
                    (r.photo ? '<img class="r-photo" alt="观鸟照片" title="照片已存入云端相册">' : '') +
                    '<div class="r-info">' +
                    '<div class="r-name">🐦 ' + esc(r.name) + '</div>' +
                    '<div class="r-meta">' + esc(r.date) + ' · ' + esc(r.place) + '</div>' +
                    (r.note ? '<div class="r-note">' + esc(r.note) + '</div>' : '') +
                    '</div>' +
                    '<button class="record-del" data-id="' + esc(r.id) + '" title="删除这条记录">✕</button>' +
                    '</div>';
            }
            recordList.innerHTML = html;

            // 私有桶没有公开链接：逐张生成临时签名 URL 显示缩略图
            if (photoRows.length > 0) {
                var imgs = recordList.querySelectorAll(".r-photo");
                for (var j = 0; j < imgs.length && j < photoRows.length; j++) {
                    (function (img, rec) {
                        supabase.storage.from(BUCKET).createSignedUrl(rec.photo, 60 * 60).then(function (res2) {
                            if (!res2.error && res2.data && res2.data.signedUrl) {
                                img.src = res2.data.signedUrl;
                            } else {
                                img.style.opacity = "0.4";
                            }
                        });
                    })(imgs[j], photoRows[j]);
                }
            }
        }

        // 写入当前账号的记录
        function saveRecordToCloud(rec) {
            return supabase.from(TABLE).insert({
                user_id: currentUserId,
                name: rec.name,
                place: rec.place,
                date: rec.date,
                note: rec.note,
                photo: rec.photo || ""
            }).then(function (res) {
                if (res.error) { throw new Error(res.error.message); }
            });
        }

        function resetForm() {
            recName.value = "";
            recPlace.value = "";
            recNote.value = "";
            clearPhoto();
        }

        // 旧版本存于本机的记录：仅当云端还没有记录时询问是否同步（防止换账号重复同步）
        function maybeMigrateLocal() {
            var raw = null;
            try { raw = localStorage.getItem(STORE_KEY); } catch (e) { }
            if (!raw) return;
            var arr = [];
            try {
                arr = JSON.parse(raw);
                if (!Array.isArray(arr)) return;
            } catch (e) { return; }
            var pending = arr.filter(function (r) { return r && r.name; });
            if (pending.length === 0) {
                try { localStorage.removeItem(STORE_KEY); } catch (e) { }
                return;
            }
            supabase.from(TABLE).select("id", { count: "exact", head: true })
                .eq("user_id", currentUserId)
                .then(function (cnt) {
                    if (cnt.error || (cnt.count || 0) > 0) return;
                    if (confirm("检测到本机有 " + pending.length + " 条未同步的旧记录，是否同步到当前账号？（同步完成后会删除本机数据）")) {
                        migrateLocal(pending);
                    }
                });
        }

        function migrateLocal(arr) {
            var rows = arr.map(function (r) {
                return {
                    user_id: currentUserId,
                    name: r.name,
                    place: r.place || "未填写",
                    date: r.date || "",
                    note: r.note || "",
                    photo: r.photo || ""
                };
            });
            supabase.from(TABLE).insert(rows).then(function (res) {
                if (res.error) {
                    alert("同步失败：" + res.error.message);
                    return;
                }
                try { localStorage.removeItem(STORE_KEY); } catch (e) { }
                alert("已同步 " + rows.length + " 条记录到当前账号");
                loadRecords();
            });
        }

        // 选择照片：压缩转 JPEG（与相册上传同款）
        recPhoto.addEventListener("change", function () {
            var file = recPhoto.files && recPhoto.files[0];
            if (!file) return;
            readAsJPEG(file, function (out) {
                pendingPhoto = {
                    out: out,
                    fileName: file.name,
                    isJpeg: out.type === "image/jpeg"
                };
                recPhotoName.textContent = file.name;
                recPhotoPreview.src = URL.createObjectURL(out);
                recPhotoPreview.style.display = "";
                recPhotoClear.style.display = "";
            });
        });

        function clearPhoto() {
            pendingPhoto = null;
            recPhoto.value = "";
            recPhotoName.textContent = "";
            recPhotoPreview.src = "";
            recPhotoPreview.style.display = "none";
            recPhotoClear.style.display = "none";
        }

        recPhotoClear.addEventListener("click", clearPhoto);

        // 上传照片到云端相册（与 gallery 同桶同路径：{userId}/xxx），返回照片路径
        function uploadRecordPhoto() {
            return new Promise(function (resolve, reject) {
                if (!pendingPhoto) { resolve(null); return; }
                if (!supabase) { reject("云端服务未初始化"); return; }
                supabase.auth.getSession().then(function (res) {
                    var session = res.data && res.data.session;
                    if (!session || !session.user) { reject("未登录"); return; }
                    var ext = pendingPhoto.isJpeg ? "jpg"
                        : (pendingPhoto.fileName.split(".").pop() || "jpg").toLowerCase();
                    var name = Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + ext;
                    var path = session.user.id + "/" + name;
                    supabase.storage.from(BUCKET).upload(path, pendingPhoto.out, {
                        contentType: pendingPhoto.out.type || undefined,
                        upsert: false
                    }).then(function (up) {
                        if (up.error) { reject(up.error.message); return; }
                        resolve(path);
                    });
                });
            });
        }

        // 把图片统一转成 JPEG（压缩最长边 2048px），解决手机 HEIC/大图兼容问题
        function readAsJPEG(file, cb) {
            var url = URL.createObjectURL(file);
            var img = new Image();
            img.onload = function () {
                try {
                    var maxDim = 2048;
                    var w = img.naturalWidth || 0;
                    var h = img.naturalHeight || 0;
                    if (!w || !h) { URL.revokeObjectURL(url); cb(file); return; }
                    var scale = Math.min(1, maxDim / Math.max(w, h));
                    var canvas = document.createElement("canvas");
                    canvas.width = Math.round(w * scale);
                    canvas.height = Math.round(h * scale);
                    canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(url);
                    canvas.toBlob(function (blob) {
                        cb(blob || file);
                    }, "image/jpeg", 0.85);
                } catch (e) {
                    URL.revokeObjectURL(url);
                    cb(file);
                }
            };
            img.onerror = function () {
                URL.revokeObjectURL(url);
                cb(file);
            };
            img.src = url;
        }

        addRec.addEventListener("click", function () {
            if (!isLoggedIn) {
                alert("记录本为私密内容，请先登录。");
                if (confirm("是否前往登录页？")) {
                    window.location.href = "login.html?next=records.html";
                }
                return;
            }
            var name = recName.value.trim();
            var place = recPlace.value.trim() || "未填写";
            var date = recDate.value || new Date().toISOString().slice(0, 10);
            var note = recNote.value.trim();
            if (!name) {
                alert("请先填写鸟种名称");
                return;
            }
            var rec = { name: name, place: place, date: date, note: note };

            var finalize = function () {
                addRec.disabled = false;
                addRec.textContent = "添加记录";
            };

            if (!pendingPhoto) {
                // 无照片：直接写入云端
                saveRecordToCloud(rec).then(function () {
                    resetForm();
                    loadRecords();
                }).catch(function (e) {
                    alert("保存失败：" + e.message + "\n（本次记录未保存，请重试）");
                }).then(finalize);
                return;
            }

            // 有照片：先上传照片再写入记录
            addRec.disabled = true;
            addRec.textContent = "上传中……";
            uploadRecordPhoto().then(function (path) {
                rec.photo = path;
                return saveRecordToCloud(rec);
            }).then(function () {
                resetForm();
                loadRecords();
            }).catch(function (errMsg) {
                if (errMsg === "未登录") {
                    alert("上传照片需要登录账号，本次记录未保存。");
                    if (confirm("是否前往登录页？")) {
                        window.location.href = "login.html?next=records.html";
                    }
                } else {
                    var m = (errMsg && errMsg.message) ? errMsg.message : errMsg;
                    alert("保存失败：" + m + "\n（本次记录未保存，请重试）");
                }
            }).then(finalize);
        });

        recordList.addEventListener("click", function (e) {
            var btn = e.target.closest ? e.target.closest(".record-del") : null;
            if (!btn) return;
            var id = btn.getAttribute("data-id");
            if (!id) return;
            if (!confirm("确定删除这条记录吗？")) return;
            supabase.from(TABLE).delete().eq("id", id).then(function (res) {
                if (res.error) {
                    alert("删除失败：" + res.error.message);
                    return;
                }
                loadRecords();
            });
        });

    })();
    </script>
</body>
</html>
