<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>观鸟相册 | BirdCloud</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 覆盖 style.css 的 .container 三列网格布局，改为整行流式布局并加宽 */
        main.container {
            width: 92%;
            max-width: 1400px;
            display: block;
            margin-bottom: 60px;
        }

        .panel {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            padding: 30px 24px;
        }

        .upload-panel {
            margin-bottom: 26px;
        }

        .upload-panel h2 {
            margin: 0 0 12px;
            font-size: 32px;
        }

        /* ---- 公共 / 私有 标签页 ---- */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .tab {
            border: none;
            border-radius: 10px;
            padding: 10px 22px;
            font-size: 15px;
            cursor: pointer;
            background: #eef4f8;
            color: #345;
            transition: all 0.15s;
        }

        .tab:hover {
            background: #e2eef5;
        }

        .tab.active {
            background: #72bcd4;
            color: #fff;
            font-weight: 600;
        }

        #hint {
            margin: 0 0 16px;
            font-size: 15px;
            color: #789;
            min-height: 20px;
        }

        /* ---- 上传表单 ---- */
        .upload-form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        .upload-form input[type="text"],
        .upload-form input[type="date"] {
            padding: 11px 12px;
            border: 1px solid #cfe3ee;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            background: #fbfdff;
        }

        .upload-form input[type="text"] { width: 200px; }

        .upload-form input:focus {
            border-color: #72bcd4;
        }

        .upload-form textarea {
            width: 100%;
            max-width: 560px;
            padding: 10px 12px;
            border: 1px solid #cfe3ee;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            background: #fbfdff;
            resize: vertical;
            min-height: 54px;
            font-family: inherit;
            line-height: 1.5;
        }

        .upload-form textarea:focus {
            border-color: #72bcd4;
        }

        .note-count {
            font-size: 12px;
            color: #99a;
            text-align: right;
            width: 100%;
            max-width: 560px;
            margin: -4px 0 0;
            padding: 0 2px;
        }

        .note-count.over {
            color: #d1493f;
        }

        .btn-add {
            display: inline-block;
            padding: 12px 28px;
            border: none;
            border-radius: 12px;
            background: #72bcd4;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
        }

        .btn-add:hover {
            opacity: 0.88;
        }

        #status {
            min-height: 20px;
            margin: 14px 0 0;
            font-size: 15px;
            color: #4c9ab5;
            text-align: center;
        }

        /* ---- 相册网格 ---- */
        .gallery-panel h3 {
            margin: 0 0 18px;
            font-size: 20px;
            color: #345;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ---- 查看更多图片 ---- */
        .gallery-more {
            text-align: center;
            margin: 24px 0 4px;
        }

        .gallery-more[hidden] {
            display: none;
        }

        .gallery-more .btn-more {
            display: inline-block;
            padding: 12px 30px;
            border-radius: 12px;
            background: #72bcd4;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 6px 16px rgba(114, 188, 212, 0.35);
            transition: transform 0.15s, opacity 0.15s;
        }

        .gallery-more .btn-more:hover {
            transform: translateY(-2px);
            opacity: 0.92;
        }

        .gallery-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
        }

        .gallery-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
            cursor: zoom-in;
            background: #eef4f8;
        }

        /* ---- 多图轮播（一篇帖子多张图） ---- */
        .photo-slider {
            position: relative;
            height: 150px;
            overflow: hidden;
            background: #eef4f8;
        }

        .photo-slider .slider-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.25s;
            cursor: zoom-in;
        }

        .photo-slider .slider-img.active {
            opacity: 1;
        }

        .slider-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            padding: 0 0 2px;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.42);
            color: #fff;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slider-nav:hover {
            background: rgba(0, 0, 0, 0.6);
        }

        .slider-nav.prev { left: 8px; }
        .slider-nav.next { right: 8px; }

        .slider-count {
            position: absolute;
            right: 8px;
            bottom: 8px;
            z-index: 3;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 12px;
            line-height: 1.5;
        }

        .slider-dots {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 9px;
            z-index: 3;
            display: flex;
            justify-content: center;
            gap: 5px;
            pointer-events: none;
        }

        .slider-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.55);
        }

        .slider-dot.on {
            background: #fff;
        }

        .del-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            border: none;
            border-radius: 8px;
            background: rgba(220, 53, 69, 0.88);
            color: #fff;
            font-size: 14px;
            width: 30px;
            height: 30px;
            line-height: 1;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.15s;
            z-index: 2;
        }

        .gallery-item:hover .del-btn {
            opacity: 1;
        }

        .del-btn:hover {
            background: #c82333;
        }

        .del-btn[data-pending="1"] {
            width: auto;
            padding: 0 10px;
            font-size: 13px;
            background: #c82333;
            opacity: 1;
        }

        .share-btn {
            position: absolute;
            top: 8px;
            left: 8px;
            border: none;
            border-radius: 8px;
            background: rgba(37, 99, 235, 0.88);
            color: #fff;
            font-size: 12px;
            padding: 5px 8px;
            line-height: 1;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.15s;
            z-index: 2;
            white-space: nowrap;
        }

        .gallery-item:hover .share-btn {
            opacity: 1;
        }

        .share-btn:hover {
            background: #1d4ed8;
        }

        .gallery-item .caption {
            padding: 10px 12px;
        }

        .caption .cap-author {
            font-size: 14px;
            color: #345;
            font-weight: 600;
        }

        .caption .cap-meta {
            font-size: 12px;
            color: #789;
            margin-top: 3px;
            line-height: 1.5;
        }

        .caption .cap-note {
            font-size: 13px;
            color: #567;
            margin-top: 6px;
            line-height: 1.5;
            background: #f3f9fc;
            border-left: 3px solid #72bcd4;
            padding: 5px 8px;
            border-radius: 0 6px 6px 0;
            word-break: break-word;
        }

        .empty {
            color: #99a;
            padding: 60px 20px;
            text-align: center;
            font-size: 18px;
            line-height: 2;
        }

        /* ---- 手机端适配 ---- */
        @media (max-width: 900px) {
            /* 无 hover：删除/分享按钮常显 */
            .del-btn,
            .share-btn {
                opacity: 1;
            }

            .del-btn,
            .share-btn {
                width: 32px;
                height: 32px;
                padding: 0;
                font-size: 14px;
            }

            /* 上传表单输入全宽 */
            .upload-form {
                width: 100%;
                max-width: 560px;
                margin: 0 auto;
            }

            .upload-form input[type="text"],
            .upload-form input[type="date"] {
                width: 100%;
            }

            .btn-add {
                width: 100%;
                padding: 13px 0;
            }

            .tabs {
                gap: 8px;
                margin-bottom: 12px;
            }

            .tab {
                flex: 1;
                padding: 10px 0;
                text-align: center;
            }

            .gallery-item img {
                height: 170px;
            }

            .photo-slider {
                height: 170px;
            }

            .slider-nav {
                width: 32px;
                height: 32px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Weather switch -->
    <div class="weather-switch" id="weatherSwitch">
        <button data-mode="sunny" onclick="window.setWeather&&window.setWeather('sunny')">☀️ 晴天</button>
        <button data-mode="cloudy" onclick="window.setWeather&&window.setWeather('cloudy')">☁️ 阴天</button>
        <button data-mode="rainy" onclick="window.setWeather&&window.setWeather('rainy')">🌧️ 雨天</button>
        <button data-mode="night" onclick="window.setWeather&&window.setWeather('night')">🌙 夜晚</button>
    </div>


    <header>
        <div class="logo">🐦 BirdCloud 观鸟笔记</div>
        <nav>
            <a href="index.html">首页</a>
            <a href="records.html">观鸟记录本</a>
            <a href="forum.html">观鸟地点</a>
            <a href="gallery.html" class="active">观鸟相册</a>
            <a href="tools.html">实用工具</a>
            <a href="fun.html">随便玩玩</a>
            <a href="login.html" id="nest-link">鸟窝入住</a>
            <a href="thanks.html">感谢名单</a>
            <a href="../birdcloud-library/index.html">鸟云图书馆</a>
        </nav>
    </header>

    <main class="container">

        <!-- 上区：添加图片（公共 / 私有共用，按当前标签页决定去向） -->
        <section class="panel upload-panel">
            <h2>观鸟相册</h2>
            <div class="tabs">
                <button class="tab active" data-tab="public">🌍 公共相册</button>
                <button class="tab" data-tab="private">🔒 我的相册</button>
            </div>
            <p id="hint">公共相册 · 所有人可见，登录后即可发图</p>
            <div class="upload-form">
                <input type="text" id="photoPlace" placeholder="📍 观测地点（必填），如：杭州西溪湿地">
                <input type="date" id="photoDate" title="观测日期">
                <input type="text" id="photoAuthor" placeholder="🐦 发布者名字（必填）">
                <textarea id="photoNote" maxlength="300" rows="2"
                    placeholder="📝 备注（选填，300 字以内），如：今天在芦苇丛里看到它俯冲捕鱼"></textarea>
                <div class="note-count" id="noteCount">0/300</div>
                <button id="addBtn" class="btn-add">＋ 发布照片（可多选）</button>
            </div>
            <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
            <div id="status"></div>
        </section>

        <!-- 下区：图片展示 -->
        <section class="panel gallery-panel">
            <h3 id="gridTitle">公共相册</h3>
            <div id="grid" class="gallery-grid">
                <div class="empty">加载中……</div>
            </div>
            <div id="moreWrap" class="gallery-more" hidden>
                <a id="moreBtn" class="btn-more" href="gallery-all.html">查看更多图片 →</a>
            </div>
        </section>

    </main>

    <footer>
        <p>BirdCloud 观鸟笔记 © 2026</p>
    </footer>

    <script src="vendor/supabase.min.js"></script>

    <script>
    (function () {

        var BUCKET_PUBLIC = "bird-public";
        var BUCKET_PRIVATE = "bird-gallery";
        var SUPABASE_URL = "https://ljgnwfswcqrzbetshocz.supabase.co";
        var SUPABASE_KEY = "sb_publishable_wxkURA_31W9WNHZkj-RJzg_WaVoLszA";
        var supabase = null;
        var isLoggedIn = false;
        var currentUserId = "";
        var currentEmail = "";
        var isAdmin = false;
        // 管理员：可删除公共相册里任意照片（数据库侧需配合 admin-delete-policy.sql）
        var ADMIN_EMAIL = "1878646255@qq.com";
        var currentTab = "public"; // public（公共相册）| private（我的相册）

        var grid = document.getElementById("grid");
        var gridTitle = document.getElementById("gridTitle");
        var moreWrap = document.getElementById("moreWrap");
        var moreBtn = document.getElementById("moreBtn");
        // 首页只展示最新几张公共照片，完整列表见 gallery-all.html
        var PUBLIC_PREVIEW = 6;
        var addBtn = document.getElementById("addBtn");
        var fileInput = document.getElementById("fileInput");
        var statusEl = document.getElementById("status");
        var hintEl = document.getElementById("hint");
        var photoPlace = document.getElementById("photoPlace");
        var photoDate = document.getElementById("photoDate");
        var photoAuthor = document.getElementById("photoAuthor");
        var photoNote = document.getElementById("photoNote");
        var noteCount = document.getElementById("noteCount");
        var tabBtns = document.querySelectorAll(".tab");

        function setStatus(text, isError) {
            if (statusEl) {
                statusEl.textContent = text;
                statusEl.style.color = isError ? "#d1493f" : "#4c9ab5";
            }
        }

        function esc(s) {
            return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        function pad(n) {
            return n < 10 ? "0" + n : "" + n;
        }

        function todayStr() {
            var d = new Date();
            return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
        }

        // 最先注册全局错误捕获
        window.addEventListener("error", function (e) {
            setStatus("页面脚本错误：" + e.message, true);
        });

        // 初始化（try-catch 包裹）
        try {
            if (!window.supabase || typeof window.supabase.createClient !== "function") {
                setStatus("错误：Supabase 库未加载", true);
            } else {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
        } catch (err) {
            setStatus("初始化失败：" + err.message, true);
        }

        function updateHint() {
            if (currentTab === "public") {
                hintEl.textContent = isLoggedIn
                    ? "🌍 公共相册 · 所有人可见，登录后即可发图（请填写地点、日期和发布者名字）"
                    : "🌍 公共相册 · 所有人可见；登录后即可发图";
            } else {
                hintEl.textContent = isLoggedIn
                    ? "🔒 我的私有相册 · 仅自己可见；悬停照片可点 📤 分享到公共相册"
                    : "🔒 我的私有相册 · 请先登录，才能查看和上传";
            }
        }

        // 备注字数实时计数（上限 300 字，超长自动截断）
        if (photoNote && noteCount) {
            photoNote.addEventListener("input", function () {
                if (photoNote.value.length > 300) {
                    photoNote.value = photoNote.value.slice(0, 300);
                }
                noteCount.textContent = photoNote.value.length + "/300";
                noteCount.classList.toggle("over", photoNote.value.length >= 300);
            });
        }

        // 登录状态 + 导航"我的鸟窝"逻辑
        if (supabase) {
            supabase.auth.getSession().then(function (res) {
                isLoggedIn = !!(res.data && res.data.session);
                if (isLoggedIn && res.data.session.user) {
                    currentUserId = res.data.session.user.id;
                    currentEmail = (res.data.session.user.email || "").toLowerCase();
                    isAdmin = currentEmail === ADMIN_EMAIL;
                    // 登录后自动填入发布者名字（取资料昵称，否则取邮箱前缀）
                    var u = res.data.session.user;
                    var nm = (u.user_metadata && (u.user_metadata.full_name || u.user_metadata.name))
                        || (u.email ? u.email.split("@")[0] : "");
                    if (nm && !photoAuthor.value) photoAuthor.value = nm;
                }

                var nest = document.getElementById("nest-link");
                if (nest) {
                    if (isLoggedIn) {
                        nest.href = "profile.html";
                        nest.textContent = "我的鸟窝";
                    } else {
                        nest.href = "login.html";
                        nest.textContent = "鸟窝入住";
                    }
                }

                photoDate.value = todayStr();
                updateHint();
                loadGallery();
            });
        }

        // 标签页切换
        for (var t = 0; t < tabBtns.length; t++) {
            (function (btn) {
                btn.addEventListener("click", function () {
                    currentTab = btn.getAttribute("data-tab");
                    for (var i = 0; i < tabBtns.length; i++) {
                        tabBtns[i].classList.toggle("active", tabBtns[i] === btn);
                    }
                    gridTitle.textContent = currentTab === "public" ? "公共相册" : "我的相册";
                    updateMore(0);
                    // 私有相册只有自己可见，无需填写发布者名字
                    photoAuthor.style.display = currentTab === "private" ? "none" : "";
                    updateHint();
                    loadGallery();
                });
            })(tabBtns[t]);
        }

        // 加载相册：公共 = 全站共享；私有 = 仅自己的记录
        function loadGallery() {
            if (!supabase) return;
            updateHint();

            if (currentTab === "private" && !isLoggedIn) {
                grid.innerHTML = '<div class="empty">🔒 我的相册是私密的<br>请先登录，才能查看你的专属观鸟相册</div>';
                setStatus("", false);
                return;
            }

            setStatus("正在加载相册……");

            var q = supabase.from("photos")
                .select("*")
                .eq("bucket", currentTab)
                .order("created_at", { ascending: false });
            if (currentTab === "private") {
                q = q.eq("user_id", currentUserId);
            }

            q.then(function (res) {
                if (res.error) {
                    var msg = (res.error.message || "");
                    if (msg.indexOf("does not exist") > -1 || msg.indexOf("relation") > -1) {
                        grid.innerHTML = '<div class="empty">📦 相册数据库尚未配置<br>' +
                            '请在 Supabase 控制台执行 <b>gallery-v2.sql</b><br>' +
                            '（创建 photos 元数据表与公共桶 bird-public）</div>';
                    } else {
                        grid.innerHTML = '<div class="empty">相册加载失败：' + esc(msg) + '</div>';
                    }
                    updateMore(0);
                    setStatus("", false);
                    return;
                }

                var rows = res.data || [];
                var totalPhotos = rows.length;
                if (rows.length === 0) {
                    if (currentTab === "public") {
                        grid.innerHTML = '<div class="empty">🐦 公共相册还是空的<br>登录后点击上方「＋ 发布照片」，发布第一篇观鸟笔记吧</div>';
                    } else {
                        grid.innerHTML = '<div class="empty">🐦 你的相册还是空的<br>点击上方「＋ 发布照片」上传第一张观鸟照片吧</div>';
                    }
                    updateMore(0);
                    setStatus("", false);
                    return;
                }

                var afterItems = function (items) {
                    // 同一篇帖子的多张图合并成一个卡片
                    var posts = groupPosts(items);
                    if (posts.length === 0) {
                        grid.innerHTML = '<div class="empty">图片加载失败，请刷新重试</div>';
                        setStatus("", true);
                        updateMore(0);
                        return;
                    }
                    var shown = posts;
                    if (currentTab === "public" && posts.length > PUBLIC_PREVIEW) {
                        shown = posts.slice(0, PUBLIC_PREVIEW);
                    }
                    renderGrid(shown, posts.length, totalPhotos);
                };

                if (currentTab === "public") {
                    // 公共桶：公开 URL 直接读取
                    var items = [];
                    for (var i = 0; i < rows.length; i++) {
                        items.push({
                            row: rows[i],
                            url: SUPABASE_URL + "/storage/v1/object/public/" + BUCKET_PUBLIC + "/" + encodeURI(rows[i].path)
                        });
                    }
                    afterItems(items);
                } else {
                    // 私有桶：逐张生成临时签名 URL（1 小时有效）
                    var items = [];
                    var pending = rows.length;
                    for (var i = 0; i < rows.length; i++) {
                        (function (row) {
                            supabase.storage.from(BUCKET_PRIVATE).createSignedUrl(row.path, 60 * 60).then(function (r) {
                                pending--;
                                if (!r.error && r.data && r.data.signedUrl) {
                                    items.push({ row: row, url: r.data.signedUrl });
                                }
                                if (pending === 0) {
                                    afterItems(items);
                                }
                            });
                        })(rows[i]);
                    }
                }
            });
        }

        // ---- 多图帖子：按文件名里的 group 标识聚合 ----
        // 上传时同一次选择的多张图共用 groupKey，路径形如 uid/p<groupKey>-<序号>.jpg
        var GROUP_RE = /(?:^|\/)p([a-z0-9]{4,})-(\d+)\./;

        function groupKeyOf(row) {
            var m = GROUP_RE.exec(row.path || "");
            return m ? "g:" + m[1] : "s:" + row.id;
        }

        function groupIndex(row) {
            var m = GROUP_RE.exec(row.path || "");
            return m ? parseInt(m[2], 10) : 0;
        }

        function groupPosts(items) {
            var map = {}, order = [];
            for (var i = 0; i < items.length; i++) {
                var k = groupKeyOf(items[i].row);
                if (!map[k]) {
                    map[k] = { key: k, items: [] };
                    order.push(k);
                }
                map[k].items.push(items[i]);
            }
            var posts = [];
            for (var j = 0; j < order.length; j++) {
                var p = map[order[j]];
                p.items.sort(function (a, b) { return groupIndex(a.row) - groupIndex(b.row); });
                posts.push(p);
            }
            return posts;
        }

        // 切到下一篇/上一篇图（dir = 1 / -1）
        function slideStep(wrap, dir) {
            var imgs = wrap.querySelectorAll(".slider-img");
            if (imgs.length < 2) return;
            var cur = 0;
            for (var i = 0; i < imgs.length; i++) {
                if (imgs[i].classList.contains("active")) { cur = i; break; }
            }
            var next = (cur + dir + imgs.length) % imgs.length;
            imgs[cur].classList.remove("active");
            imgs[next].classList.add("active");
            var c = wrap.querySelector(".slider-count");
            if (c) c.textContent = (next + 1) + " / " + imgs.length;
            var dots = wrap.querySelectorAll(".slider-dot");
            for (var d = 0; d < dots.length; d++) {
                dots[d].classList.toggle("on", d === next);
            }
        }

        // 渲染一个帖子的卡片（多图时带左右切换）
        function buildPost(post) {
            var first = post.items[0].row;
            var multi = post.items.length > 1;
            var isOwner = isLoggedIn && first.user_id === currentUserId;
            // 管理员可在公共相册删除任何人的照片；其他人只能删自己的
            var canDelete = isOwner || (isAdmin && currentTab === "public");

            var ids = [], paths = [];
            for (var k = 0; k < post.items.length; k++) {
                ids.push(post.items[k].row.id);
                paths.push(post.items[k].row.path);
            }
            var idsJson = esc(JSON.stringify(ids));
            var pathsJson = esc(JSON.stringify(paths));

            var delBtn = canDelete
                ? '<button class="del-btn" data-ids="' + idsJson + '" data-paths="' + pathsJson +
                  '" title="删除这篇照片">✕</button>'
                : "";
            var shareBtn = (currentTab === "private" && isOwner)
                ? '<button class="share-btn" data-ids="' + idsJson + '" data-paths="' + pathsJson +
                  '" title="把当前这张分享到公共相册">📤 分享</button>'
                : "";

            var author = first.author_name || "匿名鸟友";
            var place = first.place || "未填写";
            var date = first.taken_at || "未知日期";
            var note = first.note || "";
            var authorRow = currentTab === "private" ? "" : '<div class="cap-author">🐦 ' + esc(author) + '</div>';
            var noteHtml = note ? '<div class="cap-note">📝 ' + esc(note) + '</div>' : "";
            var altText = currentTab === "private" ? "我的观鸟照片" : esc(author) + " 拍摄";

            var imgs = "";
            for (var j = 0; j < post.items.length; j++) {
                var it = post.items[j];
                imgs += '<img class="slider-img' + (j === 0 ? " active" : "") + '" src="' + esc(it.url) + '"' +
                    ' data-url="' + esc(it.url) + '" data-path="' + esc(it.row.path) + '"' +
                    ' data-id="' + it.row.id + '" alt="' + altText + '" loading="lazy">';
            }

            var nav = "";
            if (multi) {
                var dots = "";
                for (var d = 0; d < post.items.length; d++) {
                    dots += '<i class="slider-dot' + (d === 0 ? " on" : "") + '"></i>';
                }
                nav = '<button class="slider-nav prev" type="button" aria-label="上一张">‹</button>' +
                      '<button class="slider-nav next" type="button" aria-label="下一张">›</button>' +
                      '<span class="slider-count">1 / ' + post.items.length + '</span>' +
                      '<div class="slider-dots">' + dots + '</div>';
            }

            return '<div class="gallery-item">' + shareBtn + delBtn +
                '<div class="photo-slider" data-total="' + post.items.length + '">' + imgs + nav + '</div>' +
                '<div class="caption">' +
                    authorRow +
                    '<div class="cap-meta">📍 ' + esc(place) + '<br>📅 ' + esc(date) +
                        (multi ? ' · 🖼️ ' + post.items.length + ' 张' : '') + '</div>' +
                    noteHtml +
                '</div></div>';
        }

        // 渲染照片网格（一篇帖子一个卡片）
        function renderGrid(posts, totalPosts, totalPhotos) {
            if (!posts || posts.length === 0) {
                grid.innerHTML = '<div class="empty">图片加载失败，请刷新重试</div>';
                setStatus("", true);
                return;
            }
            var html = "";
            for (var i = 0; i < posts.length; i++) {
                html += buildPost(posts[i]);
            }
            grid.innerHTML = html;

            var photos = typeof totalPhotos === "number" ? totalPhotos : posts.length;
            var truncated = typeof totalPosts === "number" && totalPosts > posts.length;
            var moreText = truncated ? " · 这里显示最新 " + posts.length + " 篇" : "";
            setStatus("共 " + photos + " 张照片" + moreText, false);
            updateMore(typeof totalPosts === "number" ? totalPosts : posts.length, photos);
        }

        // 「全部图片」入口：公共相册下常显，文案随数量变化
        function updateMore(total, photos) {
            if (!moreWrap || !moreBtn) return;
            var show = currentTab === "public";
            moreWrap.hidden = !show;
            if (!show) return;
            var n = typeof photos === "number" ? photos : total;
            if (total > PUBLIC_PREVIEW) {
                moreBtn.textContent = "🖼️ 查看更多图片（共 " + n + " 张）→";
            } else if (total > 0) {
                moreBtn.textContent = "🖼️ 查看全部图片（共 " + n + " 张）→";
            } else {
                moreBtn.textContent = "🖼️ 打开全部图片页 →";
            }
        }

        // 删除图片（事件委托 + 两段式确认，仅自己的照片显示删除按钮）
        var pendingDelete = null;
        var suppressClick = false;
        var touchStartX = 0, touchStartY = 0;
        var touchWrap = null;

        // 手机端左右滑动切图
        grid.addEventListener("touchstart", function (e) {
            if (e.touches.length !== 1) return;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            touchWrap = e.target.closest ? e.target.closest(".photo-slider") : null;
        }, { passive: true });

        grid.addEventListener("touchend", function (e) {
            if (!touchWrap || e.changedTouches.length !== 1) return;
            var dx = e.changedTouches[0].clientX - touchStartX;
            var dy = e.changedTouches[0].clientY - touchStartY;
            var wrap = touchWrap;
            touchWrap = null;
            if (+wrap.getAttribute("data-total") < 2) return;
            if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return;
            slideStep(wrap, dx < 0 ? 1 : -1);
            suppressClick = true;
        }, { passive: true });

        grid.addEventListener("click", function (e) {
            if (suppressClick) {
                suppressClick = false;
                return;
            }

            // 左右切换
            var navEl = e.target.closest ? e.target.closest(".slider-nav") : null;
            if (navEl) {
                slideStep(navEl.parentNode, navEl.classList.contains("next") ? 1 : -1);
                return;
            }

            // 点图片看原图
            var imgEl = e.target.closest ? e.target.closest(".slider-img") : null;
            if (imgEl) {
                window.open(imgEl.getAttribute("data-url") || imgEl.src, "_blank");
                return;
            }

            // 分享当前显示的那张
            var shareBtnEl = e.target.closest ? e.target.closest(".share-btn") : null;
            if (shareBtnEl) {
                var actImg = shareBtnEl.parentNode.querySelector(".slider-img.active");
                if (actImg) shareToPublic(actImg);
                return;
            }

            var btn = e.target.closest ? e.target.closest(".del-btn") : null;
            if (!btn) return;

            var idsStr = btn.getAttribute("data-ids") || "";

            // 第一次点击：进入"确认删除？"待确认状态
            if (pendingDelete !== idsStr) {
                var prev = grid.querySelector('.del-btn[data-pending="1"]');
                if (prev) {
                    prev.textContent = "✕";
                    prev.removeAttribute("data-pending");
                }
                pendingDelete = idsStr;
                btn.textContent = "确认?";
                btn.setAttribute("data-pending", "1");
                return;
            }

            // 第二次点击：执行删除（先删元数据记录，再删存储文件）
            pendingDelete = null;
            btn.textContent = "✕";
            btn.removeAttribute("data-pending");

            var ids = [], paths = [];
            try { ids = JSON.parse(idsStr); } catch (e1) {}
            try { paths = JSON.parse(btn.getAttribute("data-paths") || "[]"); } catch (e2) {}
            if (!ids.length) return;

            setStatus("正在删除……");

            var bucket = currentTab === "public" ? BUCKET_PUBLIC : BUCKET_PRIVATE;

            supabase.from("photos").delete().in("id", ids).select().then(function (res) {
                if (res.error) {
                    setStatus("删除记录失败：" + res.error.message, true);
                    return;
                }
                var deleted = res.data || [];
                if (deleted.length === 0) {
                    setStatus("没有权限删除：只有照片发布者或管理员可以删除", true);
                    loadGallery();
                    return;
                }
                // 只清理真正删掉的记录对应的文件（被 RLS 拦下的行不会动）
                var goneIds = {};
                for (var di = 0; di < deleted.length; di++) goneIds[deleted[di].id] = true;
                var gonePaths = [];
                for (var pi = 0; pi < ids.length; pi++) {
                    if (goneIds[ids[pi]]) gonePaths.push(paths[pi]);
                }
                return supabase.storage.from(bucket).remove(gonePaths).then(function (up) {
                    if (deleted.length < ids.length) {
                        setStatus("已删除 " + deleted.length + " 张，另有 " +
                            (ids.length - deleted.length) + " 张没有权限", true);
                        loadGallery();
                        return;
                    }
                    if (up.error) {
                        setStatus("已从相册列表移除，但文件删除失败：" + up.error.message, true);
                        return;
                    }
                    setStatus("已删除");
                    loadGallery();
                });
            });
        });

        // 分享到公共相册：复制一份到公共桶并新增公开记录（私有副本保留不动）
        function shareToPublic(imgEl) {
            var id = imgEl.getAttribute("data-id");
            var path = imgEl.getAttribute("data-path");
            var defaultName = (photoAuthor.value.trim() || "匿名鸟友");
            var name = prompt("在公共相册展示这张照片，发布者名字：", defaultName);
            if (name === null) return; // 用户取消
            name = String(name).trim() || "匿名鸟友";

            setStatus("正在分享到公共相册……");

            // 0) 防重复：同一张照片已在公共相册则提示，避免重复分享
            supabase.from("photos").select("id").eq("path", path).eq("bucket", "public").then(function (dup) {
                if (dup.error) {
                    setStatus("分享失败：" + dup.error.message, true);
                    return;
                }
                if (dup.data && dup.data.length > 0) {
                    setStatus("这张照片已经在公共相册中", true);
                    return;
                }
                // 1) 读取原私有记录，复制地点、日期、作者、备注
                supabase.from("photos").select("place,taken_at,user_id,note").eq("id", id).single().then(function (rec) {
                    if (rec.error || !rec.data) {
                        setStatus("分享失败：无法读取照片信息（" + ((rec.error && rec.error.message) || "未知错误") + "）", true);
                        return;
                    }
                    // 2) 私有桶生成临时签名 URL，拉取图片数据
                    supabase.storage.from(BUCKET_PRIVATE).createSignedUrl(path, 300).then(function (r) {
                        if (r.error || !r.data || !r.data.signedUrl) {
                            setStatus("分享失败：无法读取私有照片（" + ((r.error && r.error.message) || "未知错误") + "）", true);
                            return;
                        }
                        fetch(r.data.signedUrl).then(function (resp) {
                            if (!resp.ok) throw new Error("下载失败 HTTP " + resp.status);
                            return resp.blob();
                        }).then(function (blob) {
                            // 3) 按扩展名推断 MIME，避免 octet-stream 被公共桶白名单拒绝
                            var ext = path.split(".").pop().toLowerCase();
                            var mimeMap = { jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", webp: "image/webp", gif: "image/gif", heic: "image/heic", heif: "image/heic" };
                            var mime = mimeMap[ext] || blob.type || "image/jpeg";
                            // 4) 上传副本到公共桶（私有桶原文件保留不动）
                            return supabase.storage.from(BUCKET_PUBLIC).upload(path, blob, { contentType: mime, upsert: false }).then(function (up) {
                                if (up.error) throw new Error("复制到公共桶失败：" + up.error.message);
                                // 5) 新增一条公开记录，私有记录原样保留
                                return supabase.from("photos").insert({
                                    bucket: "public",
                                    path: path,
                                    user_id: rec.data.user_id,
                                    author_name: name,
                                    place: rec.data.place,
                                    taken_at: rec.data.taken_at,
                                    note: rec.data.note || ""
                                }).then(function (ins) {
                                    if (ins.error) throw new Error("新增公共记录失败：" + ins.error.message);
                                    setStatus("已分享到公共相册！");
                                    loadGallery();
                                });
                            });
                        }).catch(function (err) {
                            // 出错时清理刚复制到公共桶的文件，保持原状
                            supabase.storage.from(BUCKET_PUBLIC).remove([path]).then(function () {
                                setStatus("分享失败：" + err.message, true);
                            });
                        });
                    });
                });
            });
        }

        // 添加图片：先校验备注（地点、发布者名字必填）
        addBtn.addEventListener("click", function () {
            if (!isLoggedIn) {
                setStatus("请先登录后再上传图片", true);
                setTimeout(function () { window.location.href = "login.html?next=gallery.html"; }, 900);
                return;
            }
            if (!photoPlace.value.trim()) {
                setStatus("请填写观测地点", true);
                photoPlace.focus();
                return;
            }
            if (currentTab === "public" && !photoAuthor.value.trim()) {
                setStatus("请填写发布者名字", true);
                photoAuthor.focus();
                return;
            }
            fileInput.value = "";
            fileInput.click(); // 调起系统相册/文件选择器
        });

        // 把图片统一转成 JPEG（压缩最长边 2048px），解决手机 HEIC/大图/预览兼容问题；
        // 浏览器无法解码时（个别旧机型 HEIC）回退原文件，不丢数据
        function readAsJPEG(file, cb) {
            var url = URL.createObjectURL(file);
            var img = new Image();
            img.onload = function () {
                try {
                    var maxDim = 2048;
                    var w = img.naturalWidth || 0;
                    var h = img.naturalHeight || 0;
                    if (!w || !h) { URL.revokeObjectURL(url); cb(file); return; }
                    var scale = Math.min(1, maxDim / Math.max(w, h));
                    var canvas = document.createElement("canvas");
                    canvas.width = Math.round(w * scale);
                    canvas.height = Math.round(h * scale);
                    canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(url);
                    canvas.toBlob(function (blob) {
                        cb(blob || file);
                    }, "image/jpeg", 0.85);
                } catch (e) {
                    URL.revokeObjectURL(url);
                    cb(file);
                }
            };
            img.onerror = function () {
                URL.revokeObjectURL(url);
                cb(file);
            };
            img.src = url;
        }

        // 选择文件后上传：图片 → 对应桶（公共/私有）→ 写入备注元数据
        // 同一次选择的多张图共用一个 group 标识，页面上合并成一"篇"帖子
        var MAX_PER_POST = 9;

        fileInput.addEventListener("change", function () {
            var files = fileInput.files;
            if (!files || files.length === 0) return;

            var place = photoPlace.value.trim() || "未填写";
            // 私有相册无需发布者名字；公共相册必填（默认昵称/邮箱前缀）
            var author = currentTab === "private" ? "" : (photoAuthor.value.trim() || "匿名鸟友");
            var date = photoDate.value || todayStr();
            var note = photoNote ? photoNote.value.trim().slice(0, 300) : "";
            var bucket = currentTab === "public" ? BUCKET_PUBLIC : BUCKET_PRIVATE;

            var list = [];
            for (var f = 0; f < files.length && f < MAX_PER_POST; f++) {
                list.push(files[f]);
            }
            var skipped = files.length - list.length;
            fileInput.value = ""; // 允许再次选择同一批文件

            var groupKey = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
            var total = list.length;
            var done = 0;
            var failed = 0;
            var firstErr = null;

            setStatus("正在处理 0/" + total + " ……" + (skipped > 0 ? "（一次最多 " + MAX_PER_POST + " 张，多余的 " + skipped + " 张未上传）" : ""));

            for (var i = 0; i < list.length; i++) {
                (function (file, seq) {
                    readAsJPEG(file, function (out) {
                        // 转码成功的统一为 .jpg；回退的原文件保留原扩展名（如 .heic）
                        var ext = out.type === "image/jpeg" ? "jpg"
                            : (file.name.split(".").pop() || "jpg").toLowerCase();
                        // 路径里带 group 标识和序号，渲染时据此把多张图合并成一篇
                        var path = currentUserId + "/p" + groupKey + "-" + seq + "." + ext;

                        supabase.storage.from(bucket).upload(path, out, {
                            contentType: out.type || undefined,
                            upsert: false
                        }).then(function (up) {
                            if (up.error) {
                                done++;
                                failed++;
                                if (!firstErr) firstErr = up.error.message;
                                setStatus("正在上传 " + done + "/" + total + " ……" + (failed > 0 ? "（失败 " + failed + " 张）" : ""), failed > 0);
                                finish();
                                return;
                            }
                            // 写入备注：地点 / 日期 / 发布者名字 / 备注
                            supabase.from("photos").insert({
                                bucket: currentTab,
                                path: path,
                                user_id: currentUserId,
                                author_name: author,
                                place: place,
                                taken_at: date,
                                note: note
                            }).then(function (ins) {
                                done++;
                                if (ins.error) {
                                    failed++;
                                    if (!firstErr) firstErr = ins.error.message;
                                }
                                setStatus("正在上传 " + done + "/" + total + " ……" + (failed > 0 ? "（失败 " + failed + " 张）" : ""), failed > 0);
                                finish();
                            });
                        });
                    });
                })(list[i], i + 1);
            }

            function finish() {
                if (done < total) return;
                setStatus(failed === 0
                    ? (total > 1 ? "上传完成！" + total + " 张已合并为一篇帖子" : "上传完成！")
                    : "上传失败：" + firstErr, failed > 0);
                loadGallery();
            }
        });

    })();
    </script>

<script src="vendor/keepalive.js"></script>
